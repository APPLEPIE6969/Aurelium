# Aurelium Configuration (v1.5.1)
# OLD FORMAT - used for config migration testing only

# Don't touch this, used for auto-migration
config-version: 1

# --- Database ---
database:
  type: sqlite
  file: "database.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "aurelium"
    username: "root"
    password: "password"

# --- Economy ---
economy:
  default-currency: "Aurels"
  currencies:
    Aurels:
      symbol: "₳"
      starting-balance: 100.0
  max-balance: -1
  min-pay-amount: 0.01
  prefix: "<gold>[Aurelium] <gray>"
  balance: "Balance (%currency%): %amount%%symbol%"
  balance-other: "Balance of %player% (%currency%): %amount%%symbol%"
  paid: "You paid <green>%amount%%symbol%</green> to <yellow>%player%</yellow>."
  received: "You received <green>%amount%%symbol%</green> from <yellow>%player%</yellow>."
  insufficient-funds: "You don't have enough %currency%!"
  admin-give: "Gave <green>%amount%%symbol%</green> (%currency%) to <yellow>%player%</yellow>."
  admin-take: "Took <red>%amount%%symbol%</red> (%currency%) from <yellow>%player%</yellow>."
  admin-set: "Set <yellow>%player%</yellow>'s balance to <green>%amount%%symbol%</green> (%currency%)."

# --- Market ---
market:
  enabled: true
  gui-mode: modern
  dynamic-pricing: true
  price-increase-per-buy: 0.001
  price-decrease-per-sell: 0.001
  default-sell-ratio: 0.5
  price-floor: 0.2
  price-ceiling: 5.0
  price-recovery:
    enabled: true
    rate: 0.01
    interval-minutes: 10
  alerts:
    enabled: true
    threshold: 0.5
    min-base-price: 200.0
  blacklist:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_VOID
    - LIGHT

# --- Auction House ---
auction-house:
  enabled: true
  default-duration: 86400
  max-duration: 604800
  listing-fee-percent: 2.0
  sales-tax-percent: 5.0
  max-listings-per-player: -1
  min-listing-price: 1.0
  purchase-mode: STACK
  allowed-purchase-modes:
    - STACK
    - UNIT
  unit-mode-max-quantity: 64

# --- Web Dashboard ---
web:
  enabled: true
  mode: cloud
  local:
    host: "localhost"
    port: 8585
    session-timeout-minutes: 10
    cors-allowed-origins: []
  cloud:
    url: "https://webaureliummc.onrender.com"
    server-id: ""
    api-key: ""
    sync-interval: 30

# --- Custom Item Scanner ---
custom-items:
  enabled: true
  scan-on-startup: true
  scan-interval-minutes: 10
  auto-add-to-market: true
  default-price-multiplier: 1.5
  discovery-methods:
    plugin-api: true
    pdc-scan: true
    custom-model-data: true
    lore-pattern: true
    inventory-scan: true
    interaction-detect: true
  excluded-namespaces:
    - minecraft
    - aureleconomy

discovered-items: {}
