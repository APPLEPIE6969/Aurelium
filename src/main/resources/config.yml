# Aurelium Configuration (v1.5.3)

# Don't touch this, used for auto-migration
config-version: 2

# --- Database ---
database:
  # sqlite or mysql
  type: sqlite

  # SQLite
  file: "database.db"

  # MySQL (only if type is mysql)
  mysql:
    host: "localhost"
    port: 3306
    database: "aurelium"
    username: "root"
    password: "password"
    # TLS for the MySQL connection:
    #   PREFERRED       encrypt if the server supports it (default, no certificate needed)
    #   REQUIRED        refuse to connect unencrypted
    #   VERIFY_CA       encrypt and validate the server certificate — use this over the internet
    #   VERIFY_IDENTITY like VERIFY_CA, plus a hostname check
    #   DISABLED        no encryption at all (not recommended)
    ssl-mode: "PREFERRED"

# --- economy ---
economy:
  # must match a key in currencies below — if deleted, plugin falls back to first remaining currency
  default-currency: "Aurels"

  currencies:
    Aurels:
      symbol: "\u20B3"
      starting-balance: 100.0
      # add more currencies here:
      # Dollars:
      #   symbol: "$"
      #   starting-balance: 0.0

  # -1 = no cap
  max-balance: -1
  min-pay-amount: 0.01

  # Messages (MiniMessage format)
  # Placeholders: %amount%, %symbol%, %player%, %currency%
  prefix: "<gold>[Aurelium] <gray>"
  balance: "Balance (%currency%): %amount%%symbol%"
  balance-other: "Balance of %player% (%currency%): %amount%%symbol%"
  paid: "You paid <green>%amount%%symbol%</green> to <yellow>%player%</yellow>."
  received: "You received <green>%amount%%symbol%</green> from <yellow>%player%</yellow>."
  insufficient-funds: "You don't have enough %currency%!"
  admin-give: "Gave <green>%amount%%symbol%</green> (%currency%) to <yellow>%player%</yellow>."
  admin-take: "Took <red>%amount%%symbol%</red> (%currency%) from <yellow>%player%</yellow>."
  admin-set: "Set <yellow>%player%</yellow>'s balance to <green>%amount%%symbol%</green> (%currency%)."

# --- Market ---
market:
  enabled: true
  # "classic" = plain chest, "modern" = styled with borders and gradients
  gui-mode: modern
  dynamic-pricing: true
  # How much prices shift per transaction (0.001 = 0.1%)
  price-increase-per-buy: 0.001
  price-decrease-per-sell: 0.001
  # Sell price = buy price * this ratio
  default-sell-ratio: 0.5

  # Prevents auto-farms from tanking prices forever
  price-floor: 0.2 # 20% of base = minimum price
  price-ceiling: 5.0 # 500% of base = maximum price

  # Prices slowly drift back to base over time
  price-recovery:
    enabled: true
    rate: 0.01 # 1% closer per cycle
    interval-minutes: 10

  # Broadcast when expensive items crash in value
  alerts:
    enabled: true
    threshold: 0.5 # Alert at 50% of base price
    min-base-price: 200.0

  blacklist:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_VOID
    - LIGHT

# --- Auction House ---
auction-house:
  enabled: true
  default-duration: 86400 # 24 hours
  max-duration: 604800 # 7 days
  listing-fee-percent: 2.0
  sales-tax-percent: 5.0
  max-listings-per-player: -1
  min-listing-price: 1.0

  # Purchase mode: STACK = buyer gets full stack at once, UNIT = buyer chooses quantity
  purchase-mode: STACK
  allowed-purchase-modes:
    - STACK
    - UNIT
  unit-mode-max-quantity: 64

# --- Buy Orders ---
buy-orders:
  enabled: true
  max-active-orders-per-player: 10
  min-price-per-piece: 0.1
  max-order-value: -1 # -1 = no limit
  creation-fee-percent: 2.0
  sales-tax-percent: 5.0

# --- Web Dashboard ---
# Browser-based market UI. Players run /web to get a link.
web:
  enabled: true
  # "local" = runs a webserver inside the plugin (needs open port)
  # "cloud" = syncs to external server (works on all hosts)
  mode: cloud

  # Only used when mode is "local"
  local:
    # Interface the dashboard listens on. "localhost" keeps it on this machine
    # only, which is what you want unless a TLS-terminating proxy sits in front
    # of it. Setting "0.0.0.0" exposes the dashboard, and the session token in
    # its URL, on every network interface over plain HTTP.
    host: "localhost"
    port: 8585
    # Identifier this server is addressed by in dashboard URLs:
    # http://<host>:<port>/shop/<server-id>
    server-id: "local"
    # How often the dashboard snapshot is republished (seconds). Price history is
    # cached separately, so this does not scale with the history table size.
    snapshot-interval-seconds: 30
    # How often a price point is recorded per item for the dashboard chart.
    price-history-interval-minutes: 10
    session-timeout-minutes: 60
    # Avatar shown next to the player name in the dashboard header.
    #
    # Mojang removed both official name -> uuid endpoints, so a skin can only be
    # fetched from a third-party avatar service, and those cannot tell a real
    # account from a fake one: they return a generated placeholder for any name.
    # Set to "none" to always show the player's initial instead.
    avatar:
      # one of: mc-heads, minotar, none
      provider: "mc-heads"
      # 16, 32 or 64; rendered at 28px so 64 stays crisp on hidpi screens.
      size: 64
    cors-allowed-origins: []

  # Only used when mode is "cloud"
  cloud:
    url: "https://aurelium.alwaysdata.net"
    # Auto-generated on first run, don't share these
    server-id: ""
    api-key: ""
    # Set this to the same value as REGISTRATION_SECRET on the dashboard server
    # to allow authorized key rotation across server restarts
    registration-secret: ""
    sync-interval: 30

# --- Web dashboard purchase queue (mode: local) ---
# The dashboard's read snapshot is always in memory and re-derived on boot, so
# there is nothing to configure there. This only controls whether purchases
# queued from the browser survive a restart.
web-queue:
  # memory - lost on restart. Nothing is charged until a purchase completes, so
  #          nothing is at risk; the player's click just does not go through.
  # sqlite - kept in a local database file next to this one.
  type: memory
  file: "web-queue.db"


# --- Custom Item Scanner ---
custom-items:
  enabled: true
  scan-on-startup: true
  scan-interval-minutes: 10
  auto-add-to-market: true
  default-price-multiplier: 1.5
  discovery-methods:
    plugin-api: true
    pdc-scan: true
    custom-model-data: true
    lore-pattern: true
    inventory-scan: true
    interaction-detect: true
  excluded-namespaces:
    - minecraft
    - aureleconomy



# --- Market Items (auto-generated, don't edit unless you know what you're doing) ---
# Prices below are managed by the plugin. They update based on player activity.
# Delete an entry to reset it to its default price on next restart.

# --- Discovered Custom Items ---
# Entries here normally OVERRIDE items the scanner already found: change prices,
# enable/disable them, or rename them.
#
# To define an item BY HAND, add a 'material:' key. The scanner only discovers
# items owned by other item plugins (ItemsAdder, Oraxen, MMOItems, MythicMobs,
# ExecutableItems, Nexo, SX-Item) and custom items held by online players, so a
# hand-written entry with a 'material:' key is the way to add one it cannot see.
# Entries with neither a matching discovered item nor a 'material:' key are
# skipped and reported in the server log.
#
# Changes take effect after /customitems reload (no restart needed).
#
# Override a discovered item:
# itemsadder:ruby_sword:
#   source-plugin: ItemsAdder
#   display-name: "Ruby Sword"
#   category: CUSTOM_ITEMS
#   buy-price: 500.0
#   sell-price: 250.0
#   enabled: true
#
# Define an item by hand (buy-price and sell-price are required):
# config:emerald_sword:
#   material: EMERALD_SWORD
#   amount: 1
#   custom-model-data: 1001   # optional, for resource-pack models
#   item-name: "&bEmerald Sword"  # optional, & colour codes allowed
#   display-name: "Emerald Sword"
#   category: CUSTOM_ITEMS
#   buy-price: 750.0
#   sell-price: 375.0
#   enabled: true
discovered-items: {}
