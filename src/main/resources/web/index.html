<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Google Analytics 4 (GA4) -->
</head>

<body>
    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div class="loader"></div>
        <p>Connecting to server...</p>
    </div>

    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">
                    <svg class="icon logo-icon-svg" viewBox="0 0 24 24">
                        <path d="M14.5 2l7.5 7.5-7 7-7.5-7.5z" />
                        <path d="M2 22l7-7" />
                        <path d="M11 13l3.5-3.5" />
                    </svg>
                </span>
                <span class="logo-text">Server Market</span>
            </div>
        </div>
        <div class="header-center">
            <!-- Navigation Tabs -->
            <nav class="nav-tabs" id="nav-tabs">
                <button class="nav-tab active" data-page="market">
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="8" cy="21" r="1" />
                        <circle cx="19" cy="21" r="1" />
                        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.56-7.43H5.12" />
                    </svg>
                    Market
                </button>
                <button class="nav-tab" data-page="auction">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z" />
                        <path d="M7 7h.01" />
                    </svg>
                    Auction
                </button>
                <button class="nav-tab" data-page="orders">
                    <svg class="icon" viewBox="0 0 24 24">
                        <line x1="8" y1="6" x2="21" y2="6" />
                        <line x1="8" y1="12" x2="21" y2="12" />
                        <line x1="8" y1="18" x2="21" y2="18" />
                        <line x1="3" y1="6" x2="3.01" y2="6" />
                        <line x1="3" y1="12" x2="3.01" y2="12" />
                        <line x1="3" y1="18" x2="3.01" y2="18" />
                    </svg>
                    Orders
                </button>
                <button class="nav-tab" data-page="stocks">
                    <svg class="icon" viewBox="0 0 24 24">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                        <polyline points="17 6 23 6 23 12" />
                    </svg>
                    Stocks
                </button>
            </nav>
        </div>
        <div class="header-right">
            <div class="refresh-timer" id="refresh-info" title="Data updates automatically">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span id="refresh-countdown">20s</span>
            </div>
            <div class="balance-display" id="balance-display">
                <span class="balance-label">Balance</span>
                <span class="balance-amount" id="balance-amount">Loading...</span>
            </div>
            <div class="player-info" id="player-info">
                <div class="player-avatar" id="player-avatar"></div>
                <span class="player-name" id="player-name">...</span>
            </div>
        </div>
    </header>

    <!-- ═══════ PAGE: MARKET ═══════ -->
    <div class="page-content" id="page-market">
        <div class="layout">
            <!-- Sidebar -->
            <nav class="sidebar" id="sidebar">
                <div class="sidebar-header">Categories</div>
                <div class="sidebar-items" id="sidebar-categories"></div>
            </nav>

            <!-- Content area -->
            <main class="content">
                <div id="breadcrumb" class="breadcrumb"></div>
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="search-input" placeholder="Search items..." autocomplete="off">
                </div>
                <div class="items-grid" id="items-grid"></div>
                <div class="pagination" id="pagination"></div>
            </main>
        </div>
    </div>

    <!-- ═══════ PAGE: AUCTION ═══════ -->
    <div class="page-content hidden" id="page-auction">
        <div class="layout">
            <!-- Sidebar -->
            <nav class="sidebar" id="auction-sidebar">
                <div class="sidebar-header">Filters</div>
                <div class="sidebar-items" id="auction-categories"></div>
            </nav>

            <!-- Content area -->
            <main class="content">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="auction-search" placeholder="Search auctions..." autocomplete="off">
                </div>
                <div class="auctions-grid" id="auctions-grid"></div>
                <div class="pagination" id="auctions-pagination"></div>
            </main>
        </div>
    </div>

    <!-- ═══════ PAGE: ORDERS ═══════ -->
    <div class="page-content hidden" id="page-orders">
        <main class="content full-width">
            <div class="page-toolbar">
                <h2>Active Buy Orders</h2>
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="orders-search" placeholder="Search by item or buyer..."
                           autocomplete="off" data-search="handleOrdersSearch">
                </div>
            </div>

            <div class="market-stats" id="orders-stats">
                <button class="stat-tile" data-sort="all" type="button">
                    <span class="stat-label">Open orders</span>
                    <span class="stat-value" id="ostat-orders">-</span>
                </button>
                <button class="stat-tile stat-up" data-sort="pricePerPiece" type="button">
                    <span class="stat-label">Best price</span>
                    <span class="stat-value" id="ostat-best">-</span>
                </button>
                <button class="stat-tile" data-sort="amountRequested" type="button">
                    <span class="stat-label">Biggest ask</span>
                    <span class="stat-value" id="ostat-biggest">-</span>
                </button>
                <button class="stat-tile" data-sort="escrow" type="button">
                    <span class="stat-label">In escrow</span>
                    <span class="stat-value" id="ostat-escrow">-</span>
                </button>
            </div>

            <div class="filter-chips" id="orders-filters" role="group" aria-label="Filter orders by fill state">
                <button class="chip active" data-filter="all" type="button">All</button>
                <button class="chip" data-filter="unfilled" type="button">Needs items</button>
                <button class="chip" data-filter="partial" type="button">Part filled</button>
                <button class="chip" data-filter="filled" type="button">Fully filled</button>
            </div>

            <div class="orders-table-wrap" id="orders-table"></div>
            <div class="pagination" id="orders-pagination"></div>
        </main>
    </div>

    <!-- ═══════ PAGE: STOCKS ═══════ -->
    <div class="page-content hidden" id="page-stocks">
        <main class="content full-width">
            <div class="page-toolbar">
                <h2>Market</h2>
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="stocks-search" placeholder="Search markets..." data-search="handleStocksSearch">
                </div>
            </div>

            <!-- Summary strip: click a tile to sort by that measure. -->
            <div class="market-stats" id="market-stats">
                <button class="stat-tile" data-sort="all" type="button">
                    <span class="stat-label">Markets</span>
                    <span class="stat-value" id="stat-markets">-</span>
                </button>
                <button class="stat-tile stat-up" data-sort="change" type="button">
                    <span class="stat-label">Top gainer</span>
                    <span class="stat-value" id="stat-gainer">-</span>
                </button>
                <button class="stat-tile stat-down" data-sort="change" type="button">
                    <span class="stat-label">Top loser</span>
                    <span class="stat-value" id="stat-loser">-</span>
                </button>
                <button class="stat-tile" data-sort="volume" type="button">
                    <span class="stat-label">24h volume</span>
                    <span class="stat-value" id="stat-volume">-</span>
                </button>
            </div>

            <div class="stocks-table-wrap">
                <table class="stocks-table">
                    <thead>
                        <tr>
                            <th class="col-sort" data-sort="name">Item</th>
                            <th class="col-sort col-num" data-sort="buyPrice">Buy</th>
                            <th class="col-sort col-num" data-sort="sellPrice">Sell</th>
                            <th class="col-sort col-num" data-sort="volume">24h Vol</th>
                            <th class="col-sort col-num" data-sort="change">24h Change</th>
                            <th class="col-trend">7-day trend</th>
                            <th class="col-actions">Trade</th>
                        </tr>
                    </thead>
                    <tbody id="stocks-body"></tbody>
                </table>
            </div>
            <div class="pagination" id="stocks-pagination"></div>
        </main>
    </div>

    <!-- ═══════ MODALS ═══════ -->
    <!-- Buy Modal -->
    <div class="modal-overlay" id="buy-modal" role="dialog" aria-modal="true" aria-labelledby="buy-modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="buy-modal-title">Buy Item</h3>
                <button class="modal-close" data-close-modal="buy-modal" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-item">
                    <img id="buy-item-icon" class="modal-item-icon" alt="">
                    <span id="buy-item-name" class="modal-item-name"></span>
                </div>
                <div class="modal-qty">
                    <label>Quantity</label>
                    <div class="qty-input-group">
                        <button id="amount-minus" class="qty-btn" aria-label="Decrease">−</button>
                        <input type="number" id="amount-input" value="1" min="1" max="64" aria-label="Quantity">
                        <button id="amount-plus" class="qty-btn" aria-label="Increase">+</button>
                    </div>
                </div>
                <div class="modal-total">
                    <span>Total</span>
                    <span id="buy-total" class="total-price">₳0.00</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" data-close-modal="buy-modal">Cancel</button>
                <button class="btn-confirm" data-action="confirmBuy">Confirm Purchase</button>
            </div>
        </div>
    </div>

    <!-- Sell Modal -->
    <div class="modal-overlay" id="sell-modal" role="dialog" aria-modal="true" aria-labelledby="sell-modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="sell-modal-title">Sell Item</h3>
                <button class="modal-close" data-close-modal="sell-modal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-item">
                    <img id="sell-item-icon" class="modal-item-icon" alt="">
                    <span id="sell-item-name" class="modal-item-name"></span>
                </div>
                <div class="modal-qty">
                    <label>Quantity <span id="sell-hint" class="qty-hint"></span></label>
                    <div class="qty-input-group">
                        <button id="sell-amount-minus" class="qty-btn" aria-label="Decrease">&minus;</button>
                        <input type="number" id="sell-amount-input" value="1" min="1" max="64" aria-label="Quantity">
                        <button id="sell-amount-plus" class="qty-btn" aria-label="Increase">+</button>
                    </div>
                </div>
                <div class="modal-total">
                    <span>You receive</span>
                    <span id="sell-total" class="total-price">?0.00</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" data-close-modal="sell-modal">Cancel</button>
                <button class="btn-confirm" data-action="confirmSell">Confirm Sale</button>
            </div>
        </div>
    </div>

    <!-- Bid Modal -->
    <div class="modal-overlay" id="bid-modal" role="dialog" aria-modal="true" aria-labelledby="bid-modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="bid-modal-title">Place Bid</h3>
                <button class="modal-close" data-close-modal="bid-modal" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-item">
                    <img id="bid-item-icon" class="modal-item-icon" alt="">
                    <span id="bid-item-name" class="modal-item-name"></span>
                </div>
                <div class="modal-qty">
                    <label>Your Bid (per item)</label>
                    <input type="number" id="bid-amount-input" value="1" min="0.01" step="0.01" aria-label="Bid amount">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" data-close-modal="bid-modal">Cancel</button>
                <button class="btn-confirm" data-action="confirmBid">Place Bid</button>
            </div>
        </div>
    </div>

    <!-- Order Fill Modal -->
    <div class="modal-overlay" id="order-fill-modal" role="dialog" aria-modal="true" aria-labelledby="fill-modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="fill-modal-title">Fill Buy Order</h3>
                <button class="modal-close" data-close-modal="order-fill-modal" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-item">
                    <img id="fill-item-icon" class="modal-item-icon" alt="">
                    <span id="fill-item-name" class="modal-item-name"></span>
                </div>
                <div class="modal-qty">
                <label>Quantity to Fill <span id="fill-hint" class="qty-hint"></span></label>
                <div class="qty-input-group">
                    <button id="order-fill-amount-minus" class="qty-btn" aria-label="Decrease">-</button>
                    <input type="number" id="order-fill-amount-input" value="1" min="1" aria-label="Fill quantity">
                    <button id="order-fill-amount-plus" class="qty-btn" aria-label="Increase">+</button>
                </div>
                </div>
                <div class="modal-total">
                    <span>Total</span>
                    <span id="fill-total" class="total-price">₳0.00</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" data-close-modal="order-fill-modal">Cancel</button>
                <button class="btn-confirm" data-action="confirmOrderFill">Confirm Fill</button>
            </div>
        </div>
    </div>

    <!-- Stock Chart Modal -->
    <div class="modal-overlay" id="chart-modal" role="dialog" aria-modal="true" aria-labelledby="chart-modal-title">
        <div class="modal modal-chart">
            <div class="modal-header">
                <h3 id="chart-modal-title">Price History</h3>
                <button class="modal-close" data-close-modal="chart-modal" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <canvas id="chart-modal-canvas" width="800" height="400"></canvas>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" data-close-modal="chart-modal">Close</button>
            </div>
        </div>
    </div>

    <!-- Error Overlay -->
    <div class="modal-overlay" id="error-overlay" role="alertdialog" aria-modal="true" aria-labelledby="error-title">
        <div class="modal modal-error">
            <div class="modal-header">
                <h3 id="error-title">Error</h3>
            </div>
            <div class="modal-body">
                <p id="error-message"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-confirm" data-close-modal="error-overlay">OK</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/app.js"></script>
</body>

</html>
