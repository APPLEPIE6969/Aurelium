                # Test toggle back
                echo "=== Test: /customitems toggle $FIRST_ID (re-enable) ==="
                RESP=$(python3 /tmp/rcon.py "customitems toggle $FIRST_ID" 2>/dev/null || echo "RCON_FAILED")
                echo "Toggle back response: $RESP"
              fi
            else
              echo "INFO: No items in DB (mock plugin may not have loaded properly)"
            fi
          else
            echo "INFO: No SQLite DB found"
          fi

          # Test negative price rejection
          echo "=== Test: /customitems price rejects negative ==="
          RESP=$(python3 /tmp/rcon.py "customitems price test:item -5 10" 2>/dev/null || echo "RCON_FAILED")
          if echo "$RESP" | grep -qi "negative\|invalid\|must be\|cannot"; then
            echo "PASS: Negative price rejected"
          else
            echo "INFO: Negative price response: $RESP"
          fi

          # Check for CustomItemsGUI exceptions
          if grep -qi "exception.*CustomItemsGUI\|NullPointer.*CustomItemsGUI" logs/latest.log 2>/dev/null; then
            echo "FAIL: CustomItemsGUI exceptions found"
            grep -i "exception.*CustomItemsGUI\|NullPointer.*CustomItemsGUI" logs/latest.log
            FAIL=1
          else
            echo "PASS: No CustomItemsGUI exceptions"
          fi

          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          if [ "$FAIL" -ne 0 ]; then
            echo "CUSTOMITEMS GUI TEST FAILED"
            exit 1
          else
            echo "ALL CUSTOMITEMS GUI CHECKS PASSED"
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: customitems-gui-test-log
          path: logs/latest.log
          retention-days: 7
