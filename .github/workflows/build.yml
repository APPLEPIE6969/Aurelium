  # ===== 26.1.2 MYSQL TEST =====
  mysql-test:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: aurelium_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v7
        with:
          name: Aurelium-26.1.2
          path: plugins
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Start server with MySQL and test
        run: |
          mkdir -p plugins/Aurelium
          cat > plugins/Aurelium/config.yml << 'CFG'
          database:
            type: mysql
            mysql:
              host: 127.0.0.1
              port: 3306
              database: aurelium_test
              username: root
              password: test
          CFG
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started with MySQL!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
          MYSQL_FAIL=0
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Plugin loaded with MySQL"
          else
            echo "FAIL: Plugin did not load"; MYSQL_FAIL=1
          fi
          if grep -qi "sql syntax error\|sqlexception" logs/latest.log 2>/dev/null; then
            echo "FAIL: SQL syntax errors"; MYSQL_FAIL=1
          else
            echo "PASS: No SQL syntax errors"
          fi
          if mysql -h 127.0.0.1 -u root -ptest aurelium_test -e "SELECT COUNT(*) FROM custom_items;" 2>/dev/null; then
            echo "PASS: custom_items table exists in MySQL"
          else
            echo "FAIL: custom_items table missing"; MYSQL_FAIL=1
          fi
          SCHEMA_VER=$(mysql -h 127.0.0.1 -u root -ptest aurelium_test -N -e "SELECT version FROM database_info LIMIT 1;" 2>/dev/null || echo "0")
          if [ "$SCHEMA_VER" = "2" ] || [ "$SCHEMA_VER" = "v2" ]; then
            echo "PASS: MySQL schema version correct"
          else
            echo "FAIL: MySQL schema version '$SCHEMA_VER'"; MYSQL_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$MYSQL_FAIL" -ne 0 ]; then exit 1; fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-test-26-log
          path: logs/latest.log
          retention-days: 7

