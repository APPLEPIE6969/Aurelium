name: CI

on:
  push:
    branches: ["1.4.3", main, "Latest", "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]
  pull_request:
    branches: ["1.4.3", main, "Latest", "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]

permissions:
  contents: read

env:
  PAPER_26_BUILD: "69"
  PAPER_26_JAR_SHA: "d30fae0c74092b10855f0412ca6b265c60301a013d34bc28a2a41bf5682dd80b"
  PAPER_12111_BUILD: "132"
  PAPER_12111_JAR_SHA: "5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba"
  VAULT_URL: "https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar"
  VIAVERSION_URL: "https://cdn.modrinth.com/data/P1OZGk5p/versions/6LC4R0sP/ViaVersion-5.9.2-SNAPSHOT.jar"
  VIABACKWARDS_URL: "https://cdn.modrinth.com/data/NpvuJQoq/versions/Og77hOkC/ViaBackwards-5.9.2-SNAPSHOT.jar"

jobs:
  build:
    strategy:
      matrix:
        include:
          - version: "26.1.2"
            jdk: 25
            gradle_task: ":v26_1_2:shadowJar"
            artifact_name: aurelium-26-1-2
          - version: "1.21.11"
            jdk: 21
            gradle_task: ":v1_21_11:shadowJar"
            artifact_name: aurelium-1-21-11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.version }}
        run: ./gradlew ${{ matrix.gradle_task }} 2>&1 | tee build-${{ matrix.version }}.log
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
          retention-days: 1
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.version }}-log
          path: build-${{ matrix.version }}.log
          retention-days: 7

  vault-autoinstall-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v4
        with:
          name: aurelium-26-1-2
          path: artifact-tmp
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Verify Vault is NOT present initially
        run: |
          if [ -f "plugins/Vault.jar" ]; then
            echo "FAIL: Vault.jar should not exist before test"
            exit 1
          fi
          echo "PASS: Vault.jar not present (as expected)"
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Start server (first run - no Vault)
        run: |
          echo "eula=true" > eula.txt
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
      - name: Verify Vault auto-install
        run: |
          VAULT_AUTOINSTALL_FAIL=0
          
          if [ -f "plugins/Vault.jar" ]; then
            echo "PASS: Vault.jar was auto-extracted to plugins/"
          else
            echo "FAIL: Vault.jar was not auto-extracted"
            VAULT_AUTOINSTALL_FAIL=1
          fi
          
          if grep -q "Vault not found. Attempting to auto-install Vault" logs/latest.log; then
            echo "PASS: Auto-install log message found"
          else
            echo "FAIL: Auto-install log message not found"
            VAULT_AUTOINSTALL_FAIL=1
          fi
          
          if grep -q "IMPORTANT: PLEASE RESTART THE SERVER TO LOAD VAULT" logs/latest.log; then
            echo "PASS: Restart required message found"
          else
            echo "FAIL: Restart required message not found"
            VAULT_AUTOINSTALL_FAIL=1
          fi
          
          if grep -q "Aurelium has installed Vault.jar" logs/latest.log; then
            echo "PASS: Installation success message found"
          else
            echo "FAIL: Installation success message not found"
            VAULT_AUTOINSTALL_FAIL=1
          fi
          
          exit $VAULT_AUTOINSTALL_FAIL
      - name: Dump server log
        if: always()
        run: |
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          if [ -f logs/latest.log ]; then
            echo "=== Server log (last 50 lines) ==="
            tail -50 logs/latest.log
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; fi
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vault-autoinstall-log
          path: logs/latest.log
          retention-days: 7

  smoke-and-ingame-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v4
        with:
          name: aurelium-26-1-2
          path: artifact-tmp
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Start server
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
      - name: Run smoke checks
        run: |
          SMOKE_FAIL=0
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Plugin loaded"
          else
            echo "FAIL: Plugin did not load"; SMOKE_FAIL=1
          fi
          if [ -f "plugins/Aurelium/database.db" ]; then
            echo "PASS: SQLite database file exists"
          else
            echo "FAIL: No .db file"; SMOKE_FAIL=1
          fi
          SCHEMA_VER=$(sqlite3 plugins/Aurelium/database.db "SELECT version FROM database_info LIMIT 1;" 2>/dev/null || echo "0")
          if [ "$SCHEMA_VER" = "2" ] || [ "$SCHEMA_VER" = "v2" ]; then
            echo "PASS: Schema v2"
          else
            echo "FAIL: Schema version '$SCHEMA_VER'"; SMOKE_FAIL=1
          fi
          for table in players player_balances auctions offline_earnings buy_orders price_history auction_offers custom_items database_info; do
            if sqlite3 plugins/Aurelium/database.db ".tables" 2>/dev/null | grep -qw "$table"; then
              echo "PASS: Table '$table' exists"
            else
              echo "FAIL: Table '$table' missing"; SMOKE_FAIL=1
            fi
          done
          if grep -qi "exception.*aurelium\|error.*aurelium\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" 2>/dev/null; then
            echo "FAIL: Exceptions found in log"; SMOKE_FAIL=1
          fi
          exit $SMOKE_FAIL
      - name: Run RCON in-game tests
        run: python3 test_rcon.py
      - name: Dump server exceptions
        if: always()
        run: |
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          if [ -f logs/latest.log ]; then
            echo "=== Server exceptions ==="
            grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions found"
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; fi
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ingame-log
          path: logs/latest.log
          retention-days: 7

  mysql-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Start MySQL container
        run: |
          docker run -d --name mysql-test \
            -e MYSQL_ROOT_PASSWORD=test \
            -e MYSQL_DATABASE=aurelium_test \
            -p 3306:3306 \
            mysql:8.0 \
            --default-authentication-plugin=mysql_native_password
          for i in $(seq 1 30); do
            if docker exec mysql-test mysqladmin ping -h localhost -ptest 2>/dev/null; then
              echo "MySQL ready!"
              docker exec mysql-test mysql -h localhost -ptest -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'test'; FLUSH PRIVILEGES;" 2>/dev/null || true
              break
            fi
            sleep 2
          done
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v4
        with:
          name: aurelium-26-1-2
          path: artifact-tmp
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Create MySQL config
        run: |
          mkdir -p plugins/Aurelium
          cat > plugins/Aurelium/config.yml << 'CONFIG'
          database:
            type: mysql
            mysql:
              host: "127.0.0.1"
              port: 3306
              database: "aurelium_test"
              username: "root"
              password: "test"
          CONFIG
      - name: Start server and run RCON tests
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 90); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; cat logs/latest.log | tail -40; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
          python3 test_rcon.py
          RC=$?
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          echo "=== Server exceptions ==="
          grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions"
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit $RC
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-log
          path: logs/latest.log
          retention-days: 7

  scanner-mysql-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Start MySQL container
        run: |
          docker run -d --name mysql-scanner \
            -e MYSQL_ROOT_PASSWORD=test \
            -e MYSQL_DATABASE=aurelium_test \
            -p 3306:3306 \
            mysql:8.0 \
            --default-authentication-plugin=mysql_native_password
          for i in $(seq 1 30); do
            if docker exec mysql-scanner mysqladmin ping -h localhost -ptest 2>/dev/null; then
              echo "MySQL ready!"
              docker exec mysql-scanner mysql -h localhost -ptest -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'test'; FLUSH PRIVILEGES;" 2>/dev/null || true
              break
            fi
            sleep 2
          done
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v4
        with:
          name: aurelium-26-1-2
          path: artifact-tmp
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Build mock ItemsAdder
        run: |
          cd ci/mock-itemsadder
          chmod +x gradlew || true
          mkdir -p ~/.gradle
          ./gradlew jar 2>&1 || gradle jar 2>&1
          cp build/libs/*.jar ../../plugins/
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Create MySQL config
        run: |
          mkdir -p plugins/Aurelium
          cat > plugins/Aurelium/config.yml << 'CONFIG'
          database:
            type: mysql
            mysql:
              host: "127.0.0.1"
              port: 3306
              database: "aurelium_test"
              username: "root"
              password: "test"
          CONFIG
      - name: Start server and run scanner tests
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 90); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; cat logs/latest.log | tail -40; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
          sleep 5
          python3 ci/scanner_test.py
          RC=$?
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          echo "=== Server exceptions ==="
          grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions"
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit $RC
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-mysql-log
          path: logs/latest.log
          retention-days: 7

  mineflayer-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v4
        with:
          name: aurelium-26-1-2
          path: artifact-tmp
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Build mock ItemsAdder
        run: |
          cd ci/mock-itemsadder
          chmod +x gradlew || true
          mkdir -p ~/.gradle
          ./gradlew jar 2>&1 || gradle jar 2>&1
          cp build/libs/*.jar ../../plugins/
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Download ViaVersion + ViaBackwards + Vault
        run: |
          curl -sL "${{ env.VIAVERSION_URL }}" -o plugins/ViaVersion.jar
          curl -sL "${{ env.VIABACKWARDS_URL }}" -o plugins/ViaBackwards.jar
          curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Configure and start server
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          max-players=10
          gamemode=survival
          difficulty=peaceful
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 120); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "FAIL: Server did not start"; cat logs/latest.log | tail -50 || true
            kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
      - name: Wait for ViaVersion + op bot
        run: |
          for i in $(seq 1 30); do
            if grep -qi "viaversion.*enable\|viaversion.*loaded\|protocol registry" logs/latest.log 2>/dev/null; then
              echo "ViaVersion loaded!"; break
            fi
            sleep 2
          done
          sleep 5
          for i in $(seq 1 6); do
            python3 ci/rcon_op.py && break || sleep 5
          done
      - name: Install mineflayer and run tests
        run: |
          npm install mineflayer
          node mineflayer_test.js 2>&1 | tee mineflayer-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo "Mineflayer test exit code: $TEST_EXIT"
          exit $TEST_EXIT
      - name: Dump server exceptions
        if: always()
        run: |
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          if [ -f logs/latest.log ]; then
            echo "=== Server exceptions ==="
            grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions"
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; fi
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineflayer-output
          path: mineflayer-output.txt
          retention-days: 7
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mineflayer-server-log
          path: logs/latest.log
          retention-days: 7

