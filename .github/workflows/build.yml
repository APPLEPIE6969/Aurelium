          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Start server and test cloud registration
        run: |
          mkdir -p plugins/Aurelium
          cat > plugins/Aurelium/config.yml << 'CFG'
          database:
            type: sqlite
            file: "database.db"
          web:
            enabled: true
            mode: cloud
            cloud:
              url: "https://webaureliummc.onrender.com"
          CFG
          echo "eula=true" > eula.txt
          timeout 90 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
