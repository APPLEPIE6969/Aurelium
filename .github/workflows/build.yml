            echo "Server failed to start"; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
          sleep 35
          CLOUD_FAIL=0
          if grep -q "Cloud dashboard registered" logs/latest.log 2>/dev/null; then
            echo "PASS: Cloud dashboard registered!"
          elif grep -q "Cloud dashboard registration failed" logs/latest.log 2>/dev/null; then
            echo "FAIL: Cloud registration failed"; CLOUD_FAIL=1
          elif grep -q "Cloud dashboard disabled" logs/latest.log 2>/dev/null; then
            echo "FAIL: Cloud dashboard disabled"; CLOUD_FAIL=1
          else
            echo "FAIL: No cloud registration attempt found"; CLOUD_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$CLOUD_FAIL" -ne 0 ]; then exit 1; fi
