          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Setup MySQL permissions for network access
        run: |
          for i in $(seq 1 15); do
            if mysql -h127.0.0.1 -uroot -ptest -e "SELECT 1" 2>/dev/null; then
              echo "MySQL reachable, configuring root@%"
              mysql -h127.0.0.1 -uroot -ptest -e "ALTER USER IF EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'test'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION" 2>/dev/null || true
              mysql -h127.0.0.1 -uroot -ptest -e "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'test'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES"
              echo "MySQL permissions configured"
