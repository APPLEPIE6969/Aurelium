name: Build and Test

on:
  push:
    branches: ["1.4.3", main, "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]
  pull_request:
    branches: ["1.4.3", main, "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]

permissions:
  contents: read

env:
  PAPER_BUILD: "65"
  PAPER_JAR_SHA: "cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aurelium
          path: build/libs/*.jar

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          ls -lh paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start server and run smoke test
        run: |
          echo "eula=true" > eula.txt
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started successfully!"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          SMOKE_FAIL=0
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Aurelium plugin loaded successfully!"
          elif grep -q "Aurelium" logs/latest.log 2>/dev/null; then
            echo "FAIL: Aurelium mentioned in log but may have errors"
            SMOKE_FAIL=1
          else
            echo "FAIL: Aurelium not found in log"
            SMOKE_FAIL=1
          fi
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            echo "PASS: SQLite database file exists"
          else
            echo "FAIL: No .db file found"
            SMOKE_FAIL=1
          fi
          SCHEMA_VER=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT value FROM database_info WHERE key='schema_version';" 2>/dev/null || echo "0")
          if [ "$SCHEMA_VER" = "2" ] || [ "$SCHEMA_VER" = "v2" ]; then
            echo "PASS: Database migration ran"
          else
            echo "FAIL: Database schema version is '$SCHEMA_VER' (expected 2)"
            SMOKE_FAIL=1
          fi
          for table in players player_balances auctions offline_earnings buy_orders price_history auction_offers custom_items database_info; do
            if sqlite3 plugins/Aurelium/aurelium.db ".tables" 2>/dev/null | grep -qw "$table"; then
              echo "PASS: Table '$table' exists"
            else
              echo "FAIL: Table '$table' missing from database"
              SMOKE_FAIL=1
            fi
          done
          if sqlite3 plugins/Aurelium/aurelium.db "PRAGMA table_info(custom_items);" 2>/dev/null | grep -q .; then
            echo "PASS: custom_items table has columns"
            for col in canonical_id source_plugin display_name enabled buy_price sell_price item_data; do
              if sqlite3 plugins/Aurelium/aurelium.db "PRAGMA table_info(custom_items);" 2>/dev/null | grep -q "$col"; then
                echo "PASS: Column '$col' exists in custom_items"
              else
                echo " FAIL: Column '$col' missing from custom_items"
                SMOKE_FAIL=1
              fi
            done
          else
            echo "FAIL: Could not read custom_items table info"
            SMOKE_FAIL=1
          fi
          if [ -f "plugins/Aurelium/config.yml" ]; then
            echo "PASS: config.yml generated"
          else
            echo "FAIL: config.yml not found"
            SMOKE_FAIL=1
          fi
          if grep -qi "exception.*aurelium\|error.*aurelium" logs/latest.log 2>/dev/null; then
            REAL_ERR=$(grep -i "exception.*aurelium\|error.*aurelium" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART" || true)
            if [ -n "$REAL_ERR" ]; then
              echo "FAIL: Aurelium exceptions during runtime"
              echo "$REAL_ERR"
              SMOKE_FAIL=1
            else
              echo "PASS: No Aurelium exceptions during runtime"
            fi
          else
            echo "PASS: No Aurelium exceptions during runtime"
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$SMOKE_FAIL" -ne 0 ]; then
            echo "SMOKE TEST FAILED ($SMOKE_FAIL check(s) failed)"
            exit 1
          else
            echo "ALL SMOKE CHECKS PASSED"
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: logs/latest.log
          retention-days: 7

  ingame-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start server and run in-game tests
        run: |
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25575" >> server.properties
          echo "rcon.password=test" >> server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started successfully!"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 5
          python3 -c "
          import socket, struct, time
          def rcon(host, port, password, cmd):
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(10)
              s.connect((host, port))
              def send(pid, pt, data):
                  payload = data.encode() + b'\x00\x00'
                  header = struct.pack('<ii', len(payload)+10, pid) + struct.pack('<ii', 0, pt) + payload
                  s.send(header)
              def recv():
                  data = b''
                  while True:
                      try:
                          chunk = s.recv(4096)
                          if not chunk: break
                          data += chunk
                          if b'\x00\x00' in data: break
                      except: break
                  return data.decode('utf-8', errors='replace')
              send(0, 2, password)
              recv()
              send(0, 3, cmd)
              resp = recv()
              s.close()
              # Strip color codes
              import re
              resp = re.sub(r'\xa7[0-9a-fk-or]', '', resp)
              return resp
          tests = [
            ('eco give TestPlayer 100', 'gave', 'eco give works'),
            ('eco take TestPlayer 50', 'took', 'eco take works'),
            ('eco', 'Usage', 'eco rejects missing amount'),
            ('customitems', 'custom', 'customitems command works'),
            ('customitems price nonexistent_item -5 10', 'negative', 'customitems price rejects negative buy'),
            ('customitems price nonexistent_item 10 -5', 'negative', 'customitems price rejects negative sell'),
          ]
          fails = 0
          for cmd, expected, desc in tests:
            resp = rcon('127.0.0.1', 25575, 'test', cmd)
            if expected.lower() in resp.lower():
              print(f'PASS: {desc}')
            else:
              print(f'FAIL: {desc} resp={resp[:100]}')
              fails += 1
            time.sleep(1)
          exit(fails)
          "
          RCON_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$RCON_EXIT" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-test-log
          path: logs/latest.log
          retention-days: 7

  mysql-test:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: aurelium_test
        ports:
          3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start server with MySQL and test
        run: |
          mkdir -p plugins/Aurelium
          cat > plugins/Aurelium/config.yml << 'CFG'
          database:
            type: mysql
            host: 127.0.0.1
            port: 3306
            name: aurelium_test
            username: root
            password: test
          CFG
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25576" >> server.properties
          echo "rcon.password=test" >> server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started with MySQL!"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start with MySQL"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          MYSQL_FAIL=0
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Plugin loaded with MySQL"
          else
            echo "FAIL: Plugin did not load with MySQL"
            MYSQL_FAIL=1
          fi
          if grep -qi "sql syntax error\|sqlexception" logs/latest.log 2>/dev/null; then
            echo "FAIL: SQL syntax errors detected with MySQL"
            MYSQL_FAIL=1
          else
            echo "PASS: No SQL syntax errors with MySQL"
          fi
          # Check MySQL tables
          mysql -h 127.0.0.1 -u root -ptest aurelium_test -e "SHOW TABLES;" 2>/dev/null
          if mysql -h 127.0.0.1 -u root -ptest aurelium_test -e "SELECT COUNT(*) FROM custom_items;" 2>/dev/null; then
            echo "PASS: custom_items table exists in MySQL"
          else
            echo "FAIL: custom_items table missing from MySQL database"
            MYSQL_FAIL=1
          fi
          SCHEMA_VER=$(mysql -h 127.0.0.1 -u root -ptest aurelium_test -N -e "SELECT value FROM database_info WHERE key='schema_version';" 2>/dev/null || echo "0")
          if [ "$SCHEMA_VER" = "2" ] || [ "$SCHEMA_VER" = "v2" ]; then
            echo "PASS: MySQL schema version is correct"
          else
            echo "FAIL: MySQL schema version is '$SCHEMA_VER' (expected 2)"
            MYSQL_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$MYSQL_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-log
          path: logs/latest.log
          retention-days: 7

  custom-item-detection-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build mock plugins
        run: |
          for dir in ci/mock-itemsadder ci/mock-oraxen ci/mock-mmoitems; do
            cd "$dir"
            gradle build 2>/dev/null || ./gradlew build 2>/dev/null || true
            cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
            cd ../..
          done
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start server and test custom item detection
        run: |
          mkdir -p plugins
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 10
          DETECT_FAIL=0
          if grep -q "\[CustomItems\]" logs/latest.log 2>/dev/null; then
            echo "PASS: [CustomItems] output found in server log"
          else
            echo "FAIL: No [CustomItems] output found in server log"
            DETECT_FAIL=1
          fi
          if grep -q "scan complete" logs/latest.log 2>/dev/null; then
            echo "PASS: Scan completed"
          else
            echo "FAIL: Scan did not complete"
            DETECT_FAIL=1
          fi
          ITEM_COUNT=$(grep -oP 'Detected \K\d+' logs/latest.log 2>/dev/null | tail -1 || echo "0")
          if [ "$ITEM_COUNT" -ge 3 ]; then
            echo "PASS: Detected $ITEM_COUNT items (expected >= 3)"
          else
            echo "FAIL: Detected $ITEM_COUNT items (expected exactly 3 - regression detected)"
            DETECT_FAIL=1
          fi
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            DB_ITEM_COUNT=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
            if [ "$DB_ITEM_COUNT" -ge 3 ]; then
              echo "PASS: Found $DB_ITEM_COUNT items in DB"
            else
              echo "FAIL: Expected 3 items in DB, got '$DB_ITEM_COUNT'"
              DETECT_FAIL=1
            fi
            DUP_IDS=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT canonical_id FROM custom_items GROUP BY canonical_id HAVING COUNT(*) > 1;" 2>/dev/null || true)
            if [ -z "$DUP_IDS" ]; then
              echo "PASS: No duplicate canonical_ids found"
            else
              echo "FAIL: Duplicate canonical_ids found: $DUP_IDS"
              DETECT_FAIL=1
            fi
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$DETECT_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detection-test-log
          path: logs/latest.log
          retention-days: 7

  custom-items-persistence-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build mock-itemsadder
        run: |
          cd ci/mock-itemsadder
          gradle build 2>/dev/null || ./gradlew build 2>/dev/null || true
          cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Test persistence across restarts
        run: |
          mkdir -p plugins
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          # First startup
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "First startup timed out"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 10
          FIRST_COUNT=0
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            FIRST_COUNT=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
          fi
          if [ "$FIRST_COUNT" -le 0 ]; then
            echo "FAIL: No items found in DB after first startup"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "First startup: $FIRST_COUNT items in DB"
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          # Second startup
          cp logs/latest.log logs/first-startup.log
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Second startup timed out"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 10
          SECOND_COUNT=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
          echo "Second startup: $SECOND_COUNT items in DB"
          PERSIST_FAIL=0
          if [ "$SECOND_COUNT" -ge "$FIRST_COUNT" ]; then
            echo "PASS: Items persisted across restart ($FIRST_COUNT -> $SECOND_COUNT)"
          else
            echo "FAIL: Items lost after restart ($FIRST_COUNT -> $SECOND_COUNT)"
            PERSIST_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$PERSIST_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-test-log
          path: logs/latest.log
          retention-days: 7

  deduplication-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build mock plugins with overlapping CMD
        run: |
          for dir in ci/mock-itemsadder ci/mock-oraxen ci/mock-mmoitems; do
            cd "$dir"
            gradle build 2>/dev/null || ./gradlew build 2>/dev/null || true
            cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
            cd ../..
          done
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Test cross-plugin dedup
        run: |
          mkdir -p plugins
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 10
          DEDUP_FAIL=0
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            TOTAL=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
            echo "Total items in DB: $TOTAL"
            DUP_IDS=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT canonical_id FROM custom_items GROUP BY canonical_id HAVING COUNT(*) > 1;" 2>/dev/null || true)
            if [ -z "$DUP_IDS" ]; then
              echo "PASS: No duplicate canonical_ids"
            else
              echo "FAIL: Duplicate canonical_ids: $DUP_IDS"
              DEDUP_FAIL=1
            fi
          else
            echo "FAIL: No DB found"
            DEDUP_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$DEDUP_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dedup-test-log
          path: logs/latest.log
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew test
      - name: Check code style
        run: ./gradlew checkstyleMain 2>/dev/null || echo "No checkstyle task configured"

  performance-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build stress mock
        run: |
          cd ci/mock-stress-itemsadder
          gradle build 2>/dev/null || ./gradlew build 2>/dev/null || true
          cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Run performance test
        run: |
          mkdir -p plugins
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          START_TIME=$(date +%s%N)
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          END_TIME=$(date +%s%N)
          ELAPSED_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          echo "Server startup time: ${ELAPSED_MS}ms"
          PERF_FAIL=0
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            ITEM_COUNT=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
            echo "Items in DB: $ITEM_COUNT"
            if [ "$ITEM_COUNT" -gt 0 ]; then
              echo "PASS: Items scanned under load"
            else
              echo "FAIL: No items scanned"
              PERF_FAIL=1
            fi
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$PERF_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-test-log
          path: logs/latest.log
          retention-days: 7
