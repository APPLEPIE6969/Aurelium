          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 90); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; cat logs/latest.log | tail -40; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
          sleep 5
          python3 ci/scanner_test.py
          RC=$?
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          echo "=== Server exceptions ==="
          grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions"
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit $RC
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scanner-mysql-log
          path: logs/latest.log
          retention-days: 7

  # ===== MINEFLAYER TEST (26.1.2) =====
  mineflayer-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v7
        with:
          name: aurelium-26-1-2
          path: plugins
      - name: Build mock ItemsAdder
        run: |
          cd ci/mock-itemsadder
          chmod +x gradlew || true
          mkdir -p ~/.gradle
          ./gradlew jar 2>&1 || gradle jar 2>&1
          cp build/libs/*.jar ../../plugins/
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Download ViaVersion + ViaBackwards + Vault
        run: |
          curl -sL "${{ env.VIAVERSION_URL }}" -o plugins/ViaVersion.jar
          curl -sL "${{ env.VIABACKWARDS_URL }}" -o plugins/ViaBackwards.jar
          curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Configure and start server
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          max-players=10
          gamemode=survival
          difficulty=peaceful
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 120); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "FAIL: Server did not start"; cat logs/latest.log | tail -50 || true
            kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
      - name: Wait for ViaVersion + op bot
        run: |
          for i in $(seq 1 30); do
            if grep -qi "viaversion.*enable\|viaversion.*loaded\|protocol registry" logs/latest.log 2>/dev/null; then
              echo "ViaVersion loaded!"; break
            fi
            sleep 2
          done
          sleep 3
          python3 << 'PYEOF_RCON'
import socket, struct
def rcon_read(sock):
    raw = b''
    while len(raw) < 4:
        chunk = sock.recv(4 - len(raw))
        if not chunk: return None
        raw += chunk
    l = struct.unpack('<i', raw[:4])[0]
    body_data = b''
    while len(body_data) < l:
        chunk = sock.recv(min(l - len(body_data), 4096))
        if not chunk: return None
        body_data += chunk
    return body_data

def rcon_auth(sock, pwd):
    body = pwd.encode() + b'\x00'
    data = struct.pack('<ii', 1, 3) + body + b'\x00'
    sock.sendall(struct.pack('<i', len(data)) + data)
    for _ in range(2):
        pkt = rcon_read(sock)
        if pkt is None: return False
    return True

def rcon_cmd(sock, cmd):
    body = cmd.encode() + b'\x00'
    data = struct.pack('<ii', 2, 2) + body + b'\x00'
    sock.sendall(struct.pack('<i', len(data)) + data)
    pkt = rcon_read(sock)
    if pkt is None: return ''
    return pkt[8:].rstrip(b'\x00').decode(errors='replace')

s = socket.socket()
s.settimeout(10)
s.connect(('127.0.0.1', 25575))
if rcon_auth(s, 'test'):
    resp = rcon_cmd(s, 'op TestBot')
    print(f'op TestBot: {repr(resp)}')
else:
    print('RCON auth failed')
s.close()
PYEOF_RCON
      - name: Install mineflayer and run tests
        run: |
          npm install mineflayer
          node mineflayer_test.js 2>&1 | tee mineflayer-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo "Mineflayer test exit code: $TEST_EXIT"
          exit $TEST_EXIT
      - name: Dump server exceptions
        if: always()
        run: |
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          if [ -f logs/latest.log ]; then
            echo "=== Server exceptions ==="
            grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions"
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; fi
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mineflayer-output
          path: mineflayer-output.txt
          retention-days: 7
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mineflayer-server-log
          path: logs/latest.log
          retention-days: 7

  # ===== MINEFLAYER TEST (1.21.11) =====
  mineflayer-test-1-21-11:
