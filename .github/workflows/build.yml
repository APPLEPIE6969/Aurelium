  # ============================================================
  # PERFORMANCE TEST - 500 items stress test
  # ============================================================
  performance-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build stress mock ItemsAdder (500 items)
      run: |
        cd ci/mock-stress-itemsadder
        gradle build
        cp build/libs/*.jar ../../mock-stress-itemsadder.jar
    - name: Download Paper 26.1.2
      run: |
        curl -sL "https://fill-data.papermc.io/v1/objects/${PAPER_JAR_SHA}/paper-26.1.2-${PAPER_BUILD}.jar" -o paper.jar
    - name: Download plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: Aurelium
        path: plugins/
    - name: Accept EULA
      run: echo "eula=true" > eula.txt
    - name: Start server with stress mock plugin
      timeout-minutes: 10
      run: |
        mkdir -p plugins
        cp mock-stress-itemsadder.jar plugins/
        java -Dpaper.playerconnection.keepalive=60 -Xmx768M -Xms768M -jar paper.jar --nogui --max-players=5 &
        SERVER_PID=$!
        TIMEOUT=300
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server started with stress plugin!"
            break
          fi
          if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            tail -50 logs/latest.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Server startup timed out"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        # Wait for scanner to complete
        sleep 10

        PERF_FAIL=0

        # Verify scan completed
        if grep -qi "Scan complete" logs/latest.log; then
          echo "OK: Scan completed"
        else
          echo "FAIL: Scan did not complete within timeout"
          PERF_FAIL=1
        fi

        # Verify all 500 items registered
        DB_FILE=$(ls plugins/Aurelium/*.db 2>/dev/null | head -1)
        if [ -n "$DB_FILE" ]; then
          COUNT=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
          echo "Items in DB: $COUNT"
          if [ "$COUNT" -ge 500 ]; then
            echo "PASS: At least 500 items registered ($COUNT)"
          else
            echo "FAIL: Expected at least 500 items, got $COUNT"
            PERF_FAIL=1
          fi

          # Check no duplicate canonical_ids
          DUPES=$(sqlite3 "$DB_FILE" "SELECT canonical_id, COUNT(*) FROM custom_items GROUP BY canonical_id HAVING COUNT(*) > 1;" 2>/dev/null || echo "")
          if [ -z "$DUPES" ]; then
            echo "PASS: No duplicate canonical_ids"
          else
            echo "FAIL: Duplicate canonical_ids found: $DUPES"
            PERF_FAIL=1
          fi
        else
          echo "FAIL: No SQLite DB file found"
          PERF_FAIL=1
        fi

        # Check for errors
        REAL_ERRORS=$(grep -i "Exception.*aurel\|Caused by:.*aurel" logs/latest.log 2>/dev/null | grep -vi "PLEASE RESTART\|zip file" || true)
        if [ -n "$REAL_ERRORS" ]; then
          echo "FAIL: Aurelium exceptions during performance test"
          echo "$REAL_ERRORS"
          PERF_FAIL=1
        fi

        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true

        if [ "$PERF_FAIL" -ne 0 ]; then
          exit 1
        fi

    - name: Upload server log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: perf-test-log
        path: logs/latest.log
        retention-days: 7
