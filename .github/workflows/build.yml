          cat > plugins/Aurelium/config.yml << 'CONFIG'
          database:
            type: mysql
            host: 127.0.0.1
            port: 3306
            name: aurelium_test
            user: root
            password: test
          CONFIG
      - name: Start server and run scanner tests
        run: |
          echo "eula=true" > eula.txt
