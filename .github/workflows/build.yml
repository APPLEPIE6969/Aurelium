name: CI

on:
  push:
    branches: ["1.4.3", main, "Latest", "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]
  pull_request:
    branches: ["1.4.3", main, "Latest", "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PAPER_26_BUILD: "72"
  PAPER_26_JAR_SHA: "0555a0b0468a5198d8fb1a16e1f9e95c81a917a2dc8f2e09867b4044742f6401"
  PAPER_12111_BUILD: "132"
  PAPER_12111_JAR_SHA: "5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba"
  PAPER_262_BUILD: "43"
  PAPER_262_JAR_SHA: "825bbfce055d22f2e10eb108d5cfd2f554f60d80bc1e0615861e84f278f978d9"
  VAULT_URL: "https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar"
  VIAVERSION_URL: "https://cdn.modrinth.com/data/P1OZGk5p/versions/z0sCGSmk/ViaVersion-5.10.1-SNAPSHOT.jar"
  VIABACKWARDS_URL: "https://cdn.modrinth.com/data/NpvuJQoq/versions/2dyKr4e5/ViaBackwards-5.10.1-SNAPSHOT.jar"

jobs:
  build:
    strategy:
      matrix:
        include:
          - version: "26.2"
            jdk: 25
            gradle_task: ":v26_2:shadowJar"
            artifact_name: aurelium-26-2
          - version: "26.1.2"
            jdk: 25
            gradle_task: ":v26_1_2:shadowJar"
            artifact_name: aurelium-26-1-2
          - version: "1.21.11"
            jdk: 21
            gradle_task: ":v1_21_11:shadowJar"
            artifact_name: aurelium-1-21-11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build ${{ matrix.version }}
        run: |
          set -o pipefail
          ./gradlew ${{ matrix.gradle_task }} 2>&1 | tee build-${{ matrix.version }}.log
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
          retention-days: 1
      - name: "Upload JAR to paste.rs (fallback)"
        if: always()
        run: |
          JAR_PATH=$(find "versions/${{ matrix.version }}/build/libs/" -name "*.jar" -type f | head -1)
          if [ -n "$JAR_PATH" ]; then
            PASTE_URL=$(curl -sS --data-binary @"$JAR_PATH" https://paste.rs/)
            if [ -n "$PASTE_URL" ]; then
              echo "Uploaded to paste.rs: $PASTE_URL"
              echo "$PASTE_URL" > paste-url.txt
            else
              echo "paste.rs upload failed (non-fatal)"
              echo "" > paste-url.txt
            fi
          else
            echo "" > paste-url.txt
          fi
      - name: "Upload paste.rs URL"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paste-url-${{ matrix.artifact_name }}
          path: paste-url.txt
          retention-days: 1
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.version }}-log
          path: build-${{ matrix.version }}.log
          retention-days: 7

  config-migration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v8
        with:
          name: aurelium-26-1-2
          path: artifact-tmp
      - name: "Fallback: Download from paste.rs"
        if: failure()
        run: |
          mkdir -p artifact-tmp url-tmp
          echo "GitHub artifact download failed, trying paste.rs..."
          PASTE_URL=""
          curl -sS -f -o url-tmp/paste-url.zip -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=paste-url-aurelium-26-1-2" 2>/dev/null || true
          if [ -f url-tmp/paste-url.zip ] && [ -s url-tmp/paste-url.zip ]; then
            cd url-tmp && unzip -o paste-url.zip 2>/dev/null && cd ..
            PASTE_URL=$(cat url-tmp/paste-url.txt 2>/dev/null | head -1 || echo "")
          fi
          if [ -n "$PASTE_URL" ]; then
            curl -sS -f -o artifact-tmp/Aurelium.jar "$PASTE_URL" && echo "paste.rs download succeeded" || echo "paste.rs download failed"
          else
            echo "No paste.rs URL available"
          fi
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Pre-load old v1.5.1 config
        run: |
          mkdir -p plugins/Aurelium
          cp ci/old_config_v1.yml plugins/Aurelium/config.yml
          echo "=== Pre-loaded old config (config-version=1) ==="
          head -5 plugins/Aurelium/config.yml
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Start server (upgrade from old config)
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
      - name: Verify plugin loaded with old config
        run: |
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Plugin loaded with old config"
          else
            echo "FAIL: Plugin did not load"
            exit 1
          fi
          if grep -qi "config.*migrat\|upgradeConfig\|config-version" logs/latest.log 2>/dev/null; then
            echo "PASS: Config migration log message found"
          else
            echo "INFO: No explicit migration log (may be silent)"
          fi
      - name: Run config migration tests
        run: python3 ci/config_migration_test.py
      - name: Dump migrated config
        if: always()
        run: |
          if [ -f "plugins/Aurelium/config.yml" ]; then
            echo "=== Migrated config.yml (first 30 lines) ==="
            head -30 plugins/Aurelium/config.yml
            echo ""
            echo "=== config-version ==="
            grep "config-version" plugins/Aurelium/config.yml || echo "NOT FOUND"
          else
            echo "FAIL: config.yml not found after server start"
          fi
      - name: Dump server exceptions
        if: always()
        run: |
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          if [ -f logs/latest.log ]; then
            echo "=== Server exceptions ==="
            grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions found"
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; fi
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: config-migration-log
          path: logs/latest.log
          retention-days: 7

  vault-autoinstall-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v8
        with:
          name: aurelium-26-1-2
          path: artifact-tmp
      - name: "Fallback: Download from paste.rs"
        if: failure()
        run: |
          mkdir -p artifact-tmp url-tmp
          echo "GitHub artifact download failed, trying paste.rs..."
          curl -sS -f -o url-tmp/paste-url.zip -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=paste-url-aurelium-26-1-2" 2>/dev/null || true
          PASTE_URL=""
          if [ -f url-tmp/paste-url.zip ] && [ -s url-tmp/paste-url.zip ]; then
            cd url-tmp && unzip -o paste-url.zip 2>/dev/null && cd ..
            PASTE_URL=$(cat url-tmp/paste-url.txt 2>/dev/null | head -1 || echo "")
          fi
          if [ -n "$PASTE_URL" ]; then
            curl -sS -f -o artifact-tmp/Aurelium.jar "$PASTE_URL" && echo "paste.rs download succeeded" || echo "paste.rs download failed"
          else
            echo "No paste.rs URL available"
          fi
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Verify Vault is NOT present initially
        run: |
          if [ -f "plugins/Vault.jar" ]; then
            echo "FAIL: Vault.jar should not exist before test"
            exit 1
          fi
          echo "PASS: Vault.jar not present (as expected)"
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Start server (first run - no Vault)
        run: |
          echo "eula=true" > eula.txt
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
      - name: Verify Vault auto-install attempt
        run: |
          VAULT_AUTOINSTALL_FAIL=0
          if grep -q "Vault not found. Attempting to auto-install Vault" logs/latest.log; then
            echo "PASS: Auto-install attempt message found"
          else
            echo "FAIL: Auto-install attempt message not found"
            VAULT_AUTOINSTALL_FAIL=1
          fi
          if [ -f "plugins/Vault.jar" ]; then
            echo "PASS: Vault.jar was downloaded to plugins/"
          elif grep -qi "Vault.jar has been installed to" logs/latest.log; then
            echo "PASS: Vault.jar download logged (Modrinth CDN)"
          else
            echo "FAIL: Neither Vault.jar downloaded nor download logged"
            VAULT_AUTOINSTALL_FAIL=1
          fi
          if grep -q "Vault hooked" logs/latest.log; then
            echo "FAIL: Vault should not be hooked (Vault was never loaded)"
            VAULT_AUTOINSTALL_FAIL=1
          else
            echo "PASS: Vault was not hooked (as expected without Vault loaded)"
          fi
          exit $VAULT_AUTOINSTALL_FAIL
      - name: Dump server log
        if: always()
        run: |
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          if [ -f logs/latest.log ]; then
            echo "=== Server log (last 50 lines) ==="
            tail -50 logs/latest.log
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; fi
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vault-autoinstall-log
          path: logs/latest.log
          retention-days: 7

  smoke-and-ingame-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
