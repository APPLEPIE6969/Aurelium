name: Build and Test

on:
  push:
    branches: ["1.4.3", main, "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]
  pull_request:
    branches: ["1.4.3", main, "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]

permissions:
  contents: read

env:
  PAPER_BUILD: "65"
  PAPER_JAR_SHA: "cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: Aurelium
        path: build/libs/*.jar

  # ============================================================
  # SMOKE TEST - SQLite, startup, table verification, column checks
  # ============================================================
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Download Paper 26.1.2
      run: |
        PAPER_URL="https://fill-data.papermc.io/v1/objects/${PAPER_JAR_SHA}/paper-26.1.2-${PAPER_BUILD}.jar"
        echo "Downloading Paper 26.1.2 build ${PAPER_BUILD}..."
        curl -sL "$PAPER_URL" -o paper.jar
        ls -lh paper.jar
        if [ ! -s paper.jar ]; then
          echo "FAIL: paper.jar is empty or missing"
          exit 1
        fi
    - name: Download plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: Aurelium
        path: plugins/
    - name: Accept EULA
      run: echo "eula=true" > eula.txt
    - name: Start Paper server with plugin
      timeout-minutes: 5
      run: |
        java -Dpaper.playerconnection.keepalive=60 \
          -Xmx512M -Xms512M \
          -jar paper.jar --nogui \
          --max-players=5 &
        SERVER_PID=$!
        TIMEOUT=120
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server started successfully!"
            break
          fi
          if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            tail -50 logs/latest.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Server did not start within ${TIMEOUT}s"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        echo "=== Plugin Load Verification ==="
        SMOKE_FAIL=0
        if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
          echo "PASS: Aurelium plugin loaded successfully!"
        elif grep -q "Aurelium" logs/latest.log 2>/dev/null; then
          echo "FAIL: Aurelium mentioned in log but may have errors"
          grep -i "aurelium\|error\|exception" logs/latest.log | tail -10
          SMOKE_FAIL=1
        else
          echo "FAIL: Aurelium not found in log"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        echo "=== Database & Schema ==="
        if ls plugins/Aurelium/*.db 2>/dev/null; then
          echo "PASS: SQLite database file exists"
        else
          echo "FAIL: No .db file found"
          SMOKE_FAIL=1
        fi

        if grep -qi "Database migration completed\|Database outdated" logs/latest.log 2>/dev/null; then
          echo "PASS: Database migration ran"
        fi

        DB_FILE=$(ls plugins/Aurelium/*.db 2>/dev/null | head -1)
        if [ -n "$DB_FILE" ]; then
          EXPECTED_TABLES="players player_balances auctions offline_earnings buy_orders price_history auction_offers custom_items database_info"
          for table in $EXPECTED_TABLES; do
            if sqlite3 "$DB_FILE" ".tables" 2>/dev/null | grep -qw "$table"; then
              echo "PASS: Table '$table' exists"
            else
              echo "FAIL: Table '$table' missing from database"
              SMOKE_FAIL=1
            fi
          done

          SCHEMA_VER=$(sqlite3 "$DB_FILE" "SELECT version FROM database_info LIMIT 1;" 2>/dev/null || echo "unknown")
          if [ "$SCHEMA_VER" = "2" ]; then
            echo "PASS: Database schema version is v2"
          else
            echo "FAIL: Database schema version is '$SCHEMA_VER' (expected 2)"
            SMOKE_FAIL=1
          fi

          echo "=== Custom Items Table Column Check ==="
          CI_COLS=$(sqlite3 "$DB_FILE" "PRAGMA table_info(custom_items);" 2>/dev/null || echo "")
          if [ -n "$CI_COLS" ]; then
            echo "PASS: custom_items table has columns"
            for col in canonical_id source_plugin display_name enabled buy_price sell_price item_data; do
              if echo "$CI_COLS" | grep -q "$col"; then
                echo " PASS: Column '$col' exists in custom_items"
              else
                echo " FAIL: Column '$col' missing from custom_items"
                SMOKE_FAIL=1
              fi
            done
          else
            echo "FAIL: Could not read custom_items table info"
            SMOKE_FAIL=1
          fi
        fi

        if [ -f plugins/Aurelium/config.yml ]; then
          echo "PASS: config.yml generated"
        else
          echo "FAIL: config.yml not found"
          SMOKE_FAIL=1
        fi

        # messages.yml is NOT generated by the plugin (only saveDefaultConfig for config.yml)
        # so we skip checking for it

        echo "=== Exception Check ==="
        cp logs/latest.log logs/pre-shutdown.log
        REAL_ERRORS=$(grep -i "Exception.*aurel\|Caused by:.*aurel" logs/pre-shutdown.log 2>/dev/null | grep -vi "PLEASE RESTART\|zip file" || true)
        if [ -n "$REAL_ERRORS" ]; then
          echo "FAIL: Aurelium exceptions found during runtime"
          echo "$REAL_ERRORS"
          SMOKE_FAIL=1
        else
          echo "PASS: No Aurelium exceptions during runtime"
        fi

        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true

        if [ "$SMOKE_FAIL" -ne 0 ]; then
          echo "SMOKE TEST FAILED ($SMOKE_FAIL check(s) failed)"
          exit 1
        fi

    - name: Upload server log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: logs/latest.log
        retention-days: 7

    - name: Upload plugin data on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: plugin-data
        path: plugins/Aurelium/
        retention-days: 7

  # ============================================================
  # IN-GAME TEST - RCON commands against SQLite server
  # ============================================================
  ingame-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Download Paper 26.1.2
      run: |
        curl -sL "https://fill-data.papermc.io/v1/objects/${PAPER_JAR_SHA}/paper-26.1.2-${PAPER_BUILD}.jar" -o paper.jar
    - name: Download plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: Aurelium
        path: plugins/
    - name: Accept EULA and configure server
      run: |
        echo "eula=true" > eula.txt
        printf "online-mode=false\nmax-players=5\nserver-port=25565\n" > server.properties
    - name: Start Paper server (first run)
      run: |
        java -Dpaper.playerconnection.keepalive=60 \
          -Xmx768M -Xms768M \
          -jar paper.jar --nogui \
          --max-players=5 &
        SERVER_PID=$!
        TIMEOUT=150
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server ready on first run!"
            break
          fi
          if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            tail -50 logs/latest.log
            kill $SERVER_PID 2>/dev/null
            exit 1
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Server did not start in time"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null
          exit 1
        fi
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        sleep 3
        sed -i 's/online-mode=true/online-mode=false/g' server.properties
        sed -i '/^enable-rcon=/d; /^rcon\./d' server.properties
        printf "\nenable-rcon=true\nrcon.port=25575\nrcon.password=testpass\n" >> server.properties
        grep "online-mode\|rcon" server.properties
    - name: Restart Paper server with RCON
      run: |
        java -Dpaper.playerconnection.keepalive=60 \
          -Xmx768M -Xms768M \
          -jar paper.jar --nogui \
          --max-players=5 &
        SERVER_PID=$!
        echo "$SERVER_PID" > /tmp/server_pid
        TIMEOUT=90
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server restarted with RCON!"
            break
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Server did not restart in time"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null
          exit 1
        fi
        echo "Waiting for RCON port 25575..."
        for i in $(seq 1 30); do
          if nc -z 127.0.0.1 25575 2>/dev/null; then
            echo "RCON port 25575 is open!"
            break
          fi
          sleep 1
        done
        sleep 3
    - name: Run in-game RCON tests
      timeout-minutes: 3
      run: |
        python3 .github/scripts/test_ingame_rcon.py
        TEST_EXIT=$?
        echo "Test exit code: $TEST_EXIT"
        echo "=== Server Exceptions ==="
        grep -iE "Exception|Caused by|NullPointer|Stacktrace" logs/latest.log | grep -vi "PLEASE RESTART\|zip file" | tail -40 || true
        echo "=== Command Log ==="
        grep -i "aurel\|economy\|issued server command\|customitems\|custom item" logs/latest.log | tail -30 || true
        kill $(cat /tmp/server_pid) 2>/dev/null || true
        wait $(cat /tmp/server_pid) 2>/dev/null || true
        exit $TEST_EXIT

  # ============================================================
  # MYSQL TEST - Economy + customitems + custom_items table verification
  # ============================================================
  mysql-test:
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: aurelium
        ports:
        - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=testpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Download Paper 26.1.2
      run: |
        curl -sL "https://fill-data.papermc.io/v1/objects/${PAPER_JAR_SHA}/paper-26.1.2-${PAPER_BUILD}.jar" -o paper.jar
    - name: Download plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: Aurelium
        path: plugins/
    - name: Accept EULA and configure server
      run: |
        echo "eula=true" > eula.txt
        printf "online-mode=false\nmax-players=5\nserver-port=25566\n" > server.properties
    - name: Configure plugin for MySQL
      run: |
        mkdir -p plugins/Aurelium
        cat > plugins/Aurelium/config.yml << 'CFGEOF'
        config-version: 1
        database:
          type: mysql
          mysql:
            host: "127.0.0.1"
            port: 3306
            database: "aurelium"
            username: "root"
            password: "testpass"
        economy:
          default-currency: "Aurels"
          currencies:
            Aurels:
              symbol: "A"
              starting-balance: 100.0
              max-balance: -1
              min-pay-amount: 0.01
        market:
          enabled: true
          gui-mode: modern
          dynamic-pricing: true
          price-increase-per-buy: 0.001
          price-decrease-per-sell: 0.001
          default-sell-ratio: 0.5
          price-floor: 0.2
          price-ceiling: 5.0
          blacklist:
          - BEDROCK
        auction-house:
          enabled: true
          default-duration: 86400
          listing-fee-percent: 2.0
          sales-tax-percent: 5.0
        buy-orders:
          enabled: true
        web:
          enabled: false
        CFGEOF
    - name: Start Paper server with MySQL
      timeout-minutes: 5
      run: |
        java -Dpaper.playerconnection.keepalive=60 \
          -Xmx768M -Xms768M \
          -jar paper.jar --nogui \
          --max-players=5 --port=25566 &
        SERVER_PID=$!
        TIMEOUT=150
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server started with MySQL!"
            break
          fi
          if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
            echo "Server failed to start with MySQL"
            tail -50 logs/latest.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Server did not start within ${TIMEOUT}s"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        echo "=== Plugin Load Check ==="
        MYSQL_FAIL=0
        if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
          echo "PASS: Plugin loaded with MySQL"
        else
          echo "FAIL: Plugin did not load with MySQL"
          grep -i "aurel\|error\|exception" logs/latest.log | tail -20
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        if grep -qi "SQLSyntaxErrorException\|SQL syntax" logs/latest.log 2>/dev/null; then
          echo "FAIL: SQL syntax errors detected with MySQL"
          grep -i "SQLSyntax\|syntax error" logs/latest.log | tail -10
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi
        echo "PASS: No SQL syntax errors with MySQL"

        # Enable RCON for testing
        sed -i '/^enable-rcon=/d; /^rcon\./d' server.properties
        printf "\nenable-rcon=true\nrcon.port=25576\nrcon.password=testpass\n" >> server.properties
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        sleep 3

        # Restart with RCON
        java -Dpaper.playerconnection.keepalive=60 \
          -Xmx768M -Xms768M \
          -jar paper.jar --nogui \
          --max-players=5 --port=25566 &
        SERVER_PID=$!
        echo "$SERVER_PID" > /tmp/mysql_server_pid
        TIMEOUT=90
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server restarted with RCON!"
            break
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Server did not restart in time"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi
        for i in $(seq 1 30); do
          if nc -z 127.0.0.1 25576 2>/dev/null; then
            echo "RCON port open!"
            break
          fi
          sleep 1
        done
        sleep 3

        # Run MySQL RCON test script
        python3 .github/scripts/test_mysql_rcon.py
        TEST_EXIT=$?

        # MySQL custom_items table verification
        echo "=== MySQL custom_items Table Verification ==="
        CI_EXISTS=$(mysql -h 127.0.0.1 -u root -ptestpass aurelium -e "SHOW TABLES LIKE 'custom_items';" 2>/dev/null | tail -1)
        if [ "$CI_EXISTS" = "custom_items" ]; then
          echo "PASS: custom_items table exists in MySQL"
          for col in canonical_id source_plugin display_name enabled buy_price sell_price item_data; do
            COL_CHECK=$(mysql -h 127.0.0.1 -u root -ptestpass aurelium -e "SHOW COLUMNS FROM custom_items LIKE '$col';" 2>/dev/null | tail -1)
            if [ -n "$COL_CHECK" ]; then
              echo " PASS: Column '$col' exists in MySQL custom_items"
            else
              echo " FAIL: Column '$col' missing from MySQL custom_items"
              MYSQL_FAIL=1
            fi
          done
        else
          echo "FAIL: custom_items table missing from MySQL database"
          MYSQL_FAIL=1
        fi

        # Verify schema version in MySQL
        SCHEMA_VER=$(mysql -h 127.0.0.1 -u root -ptestpass aurelium -e "SELECT version FROM database_info LIMIT 1;" 2>/dev/null | tail -1)
        if [ "$SCHEMA_VER" = "2" ]; then
          echo "PASS: MySQL schema version is v2"
        else
          echo "FAIL: MySQL schema version is '$SCHEMA_VER' (expected 2)"
          MYSQL_FAIL=1
        fi

        echo "=== Server Exceptions ==="
        grep -iE "Exception|Caused by|SQLSyntax" logs/latest.log | grep -vi "PLEASE RESTART\|zip file" | tail -20 || true

        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true

        if [ "$MYSQL_FAIL" -ne 0 ]; then
          exit 1
        fi
        exit $TEST_EXIT

    - name: Upload server log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: mysql-server-log
        path: logs/latest.log
        retention-days: 7

  # ============================================================
  # CUSTOM ITEM DETECTION TEST - strict count + dedup verification
  # ============================================================
  custom-item-detection-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build mock ItemsAdder
      run: |
        cd ci/mock-itemsadder
        gradle build
        cp build/libs/*.jar ../mock-itemsadder.jar
    - name: Download Paper 26.1.2
      run: |
        curl -sL "https://fill-data.papermc.io/v1/objects/${PAPER_JAR_SHA}/paper-26.1.2-${PAPER_BUILD}.jar" -o paper.jar
        ls -lh paper.jar
        file paper.jar | head -1
    - name: Download plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: Aurelium
        path: plugins/
    - name: Accept EULA
      run: echo "eula=true" > eula.txt
    - name: Start server with mock ItemsAdder
      timeout-minutes: 5
      run: |
        if [ ! -f paper.jar ] || [ ! -s paper.jar ]; then
          echo "FAIL: paper.jar not found or empty"
          exit 1
        fi
        mkdir -p plugins
        cp ci/mock-itemsadder.jar plugins/
        java -Dpaper.playerconnection.keepalive=60 -Xmx512M -Xms512M -jar paper.jar --nogui --max-players=5 &
        SERVER_PID=$!
        TIMEOUT=180
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server started!"
            break
          fi
          if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            tail -50 logs/latest.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Server startup timed out"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        # Wait extra 5s for the 1s delayed scanner to run
        sleep 5

        echo "=== Scanner Detection Verification ==="
        DETECT_FAIL=0

        if grep -qi "\[CustomItems\]" logs/latest.log; then
          echo "OK: CustomItems scanner logged output"
          grep -i "\[CustomItems\]" logs/latest.log || true
        else
          echo "FAIL: No [CustomItems] output found in server log"
          tail -100 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        if grep -qi "Scan complete" logs/latest.log; then
          echo "OK: Scan completed"
          grep -i "Scan complete" logs/latest.log || true
        else
          echo "FAIL: Scan did not complete"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        # STRICT: Exactly 3 items (not >= 1)
        ITEM_COUNT=$(grep "Scan complete" logs/latest.log | grep -oP '\d+(?= unique)' || echo "0")
        echo "Detected items count: $ITEM_COUNT"
        if [ "$ITEM_COUNT" = "3" ]; then
          echo "PASS: Exactly 3 custom items detected (matches mock ItemsAdder)"
        elif [ "$ITEM_COUNT" -ge "1" ] 2>/dev/null; then
          echo "FAIL: Detected $ITEM_COUNT items (expected exactly 3 - regression detected)"
          DETECT_FAIL=1
        else
          echo "FAIL: Could not parse item count from scan output"
          DETECT_FAIL=1
        fi

        if grep -qi "ItemsAdder" logs/latest.log; then
          echo "OK: ItemsAdder scan ran"
        else
          echo "FAIL: ItemsAdder scan did not appear to run"
          DETECT_FAIL=1
        fi

        # DEDUP: Verify no duplicate canonical_ids in DB
        DB_FILE=$(ls plugins/Aurelium/*.db 2>/dev/null | head -1)
        if [ -n "$DB_FILE" ]; then
          DB_ITEM_COUNT=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "error")
          echo "Items in SQLite custom_items table: $DB_ITEM_COUNT"
          if [ "$DB_ITEM_COUNT" = "3" ]; then
            echo "PASS: Exactly 3 items persisted to custom_items table"
          else
            echo "FAIL: Expected 3 items in DB, got '$DB_ITEM_COUNT'"
            DETECT_FAIL=1
          fi
          # Verify no duplicate canonical_ids (dedup working)
          DUP_IDS=$(sqlite3 "$DB_FILE" "SELECT canonical_id, COUNT(*) as cnt FROM custom_items GROUP BY canonical_id HAVING cnt > 1;" 2>/dev/null || echo "")
          if [ -z "$DUP_IDS" ]; then
            echo "PASS: No duplicate canonical_ids in custom_items table (dedup working)"
          else
            echo "FAIL: Duplicate canonical_ids found: $DUP_IDS"
            DETECT_FAIL=1
          fi
        else
          echo "WARN: No SQLite DB file found, cannot verify persistence/dedup"
        fi

        # Check for errors
        cp logs/latest.log logs/pre-shutdown.log
        REAL_ERRORS=$(grep -i "Exception.*aurel\|Caused by:.*aurel" logs/pre-shutdown.log 2>/dev/null | grep -vi "PLEASE RESTART\|zip file" || true)
        if [ -n "$REAL_ERRORS" ]; then
          echo "FAIL: Aurelium exceptions during scanner test"
          echo "$REAL_ERRORS"
          DETECT_FAIL=1
        fi

        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true

        if [ "$DETECT_FAIL" -ne 0 ]; then
          exit 1
        fi

    - name: Upload server log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: detection-test-log
        path: logs/latest.log
        retention-days: 7

  # ============================================================
  # CUSTOM ITEMS PERSISTENCE TEST - restart to verify DB reload
  # ============================================================
  custom-items-persistence-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build mock ItemsAdder
      run: |
        cd ci/mock-itemsadder
        gradle build
        cp build/libs/*.jar ../mock-itemsadder.jar
    - name: Download Paper 26.1.2
      run: |
        curl -sL "https://fill-data.papermc.io/v1/objects/${PAPER_JAR_SHA}/paper-26.1.2-${PAPER_BUILD}.jar" -o paper.jar
    - name: Download plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: Aurelium
        path: plugins/
    - name: Accept EULA
      run: echo "eula=true" > eula.txt
    - name: First startup - scan and persist items
      timeout-minutes: 5
      run: |
        mkdir -p plugins
        cp ci/mock-itemsadder.jar plugins/
        java -Dpaper.playerconnection.keepalive=60 -Xmx512M -Xms512M -jar paper.jar --nogui --max-players=5 &
        SERVER_PID=$!
        TIMEOUT=180
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "First startup: Server ready!"
            break
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "First startup timed out"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi
        sleep 5

        # Verify items were scanned on first run
        FIRST_COUNT=$(sqlite3 plugins/Aurelium/*.db "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
        echo "First startup: $FIRST_COUNT items in DB"
        if [ "$FIRST_COUNT" -lt "1" ] 2>/dev/null; then
          echo "FAIL: No items found in DB after first startup"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi
        echo "PASS: Items persisted to DB on first startup"

        # Clean shutdown
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        sleep 3

        # Snapshot the DB for comparison
        DB_FILE=$(ls plugins/Aurelium/*.db 2>/dev/null | head -1)
        if [ -n "$DB_FILE" ]; then
          cp "$DB_FILE" /tmp/first_run_db.sqlite
          FIRST_IDS=$(sqlite3 /tmp/first_run_db.sqlite "SELECT canonical_id FROM custom_items ORDER BY canonical_id;" 2>/dev/null)
          echo "First run canonical IDs:"
          echo "$FIRST_IDS"
        fi

    - name: Second startup - verify items survive restart
      timeout-minutes: 5
      run: |
        # Remove mock ItemsAdder to test pure DB reload (no rescanning)
        rm -f plugins/mock-itemsadder.jar
        # Clear server log so we can check fresh
        rm -f logs/latest.log

        java -Dpaper.playerconnection.keepalive=60 -Xmx512M -Xms512M -jar paper.jar --nogui --max-players=5 &
        SERVER_PID=$!
        TIMEOUT=180
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Second startup: Server ready!"
            break
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Second startup timed out"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi
        sleep 5

        PERSIST_FAIL=0

        # Check that items loaded from database
        if grep -qi "custom.*items.*loaded\|loaded.*custom.*items\|CustomItems.*loaded" logs/latest.log; then
          echo "PASS: Custom items loaded from database on restart"
        else
          echo "INFO: No explicit 'loaded' log line (checking DB directly)"
        fi

        # Verify DB still has the same items
        DB_FILE=$(ls plugins/Aurelium/*.db 2>/dev/null | head -1)
        if [ -n "$DB_FILE" ]; then
          SECOND_COUNT=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
          echo "Second startup: $SECOND_COUNT items in DB"
          if [ "$SECOND_COUNT" = "3" ]; then
            echo "PASS: All 3 items survived server restart"
          else
            echo "FAIL: Expected 3 items after restart, got $SECOND_COUNT"
            PERSIST_FAIL=1
          fi

          # Verify same canonical IDs
          SECOND_IDS=$(sqlite3 "$DB_FILE" "SELECT canonical_id FROM custom_items ORDER BY canonical_id;" 2>/dev/null)
          FIRST_IDS=$(sqlite3 /tmp/first_run_db.sqlite "SELECT canonical_id FROM custom_items ORDER BY canonical_id;" 2>/dev/null)
          if [ "$FIRST_IDS" = "$SECOND_IDS" ]; then
            echo "PASS: Canonical IDs match between runs"
          else
            echo "FAIL: Canonical IDs changed between runs"
            echo " First: $FIRST_IDS"
            echo " Second: $SECOND_IDS"
            PERSIST_FAIL=1
          fi
        else
          echo "FAIL: No DB file found after restart"
          PERSIST_FAIL=1
        fi

        # Check for errors
        REAL_ERRORS=$(grep -i "Exception.*aurel\|Caused by:.*aurel" logs/latest.log 2>/dev/null | grep -vi "PLEASE RESTART\|zip file" || true)
        if [ -n "$REAL_ERRORS" ]; then
          echo "FAIL: Aurelium exceptions during persistence test"
          echo "$REAL_ERRORS"
          PERSIST_FAIL=1
        fi

        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true

        if [ "$PERSIST_FAIL" -ne 0 ]; then
          exit 1
        fi

    - name: Upload server log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: persistence-test-log
        path: logs/latest.log
        retention-days: 7

  # ============================================================
  # DEDUPLICATION TEST - 3 mock plugins with overlapping items
  # Tests that ItemsAdder + Oraxen + MMOItems items with same
  # Material + CustomModelData get deduplicated into 1 entry
  # ============================================================
  deduplication-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build mock ItemsAdder
      run: |
        cd ci/mock-itemsadder
        gradle build
        cp build/libs/*.jar ../../mock-itemsadder.jar
    - name: Build mock Oraxen
      run: |
        cd ci/mock-oraxen
        gradle build
        cp build/libs/*.jar ../../mock-oraxen.jar
    - name: Build mock MMOItems
      run: |
        cd ci/mock-mmoitems
        gradle build
        cp build/libs/*.jar ../../mock-mmoitems.jar
    - name: Download Paper 26.1.2
      run: |
        curl -sL "https://fill-data.papermc.io/v1/objects/${PAPER_JAR_SHA}/paper-26.1.2-${PAPER_BUILD}.jar" -o paper.jar
    - name: Download plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: Aurelium
        path: plugins/
    - name: Accept EULA
      run: echo "eula=true" > eula.txt
    - name: Start server with all 3 mock plugins
      timeout-minutes: 8
      run: |
        mkdir -p plugins
        cp mock-itemsadder.jar plugins/
        cp mock-oraxen.jar plugins/
        cp mock-mmoitems.jar plugins/
        java -Dpaper.playerconnection.keepalive=60 -Xmx768M -Xms768M -jar paper.jar --nogui --max-players=5 &
        SERVER_PID=$!
        TIMEOUT=240
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server started with all mock plugins!"
            break
          fi
          if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            tail -50 logs/latest.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "Server startup timed out"
          tail -30 logs/latest.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi

        # Wait for scanner to complete
        sleep 8

        DEDUP_FAIL=0

        # Verify scanner ran
        if grep -qi "\[CustomItems\]" logs/latest.log; then
          echo "OK: CustomItems scanner logged output"
        else
          echo "FAIL: No [CustomItems] output found"
          DEDUP_FAIL=1
        fi

        if grep -qi "Scan complete" logs/latest.log; then
          echo "OK: Scan completed"
        else
          echo "FAIL: Scan did not complete"
          DEDUP_FAIL=1
        fi

        # Verify total items: 6 (1 deduped overlap + 5 unique)
        DB_FILE=$(ls plugins/Aurelium/*.db 2>/dev/null | head -1)
        if [ -n "$DB_FILE" ]; then
          TOTAL=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "error")
          echo "Total custom items in DB: $TOTAL"
          if [ "$TOTAL" = "6" ]; then
            echo "PASS: Exactly 6 unique items (1 deduped + 5 unique)"
          else
            echo "FAIL: Expected 6 items, got $TOTAL"
            # Dump all items for debugging
            sqlite3 "$DB_FILE" "SELECT canonical_id, model_data_key, discovery_methods FROM custom_items ORDER BY canonical_id;" 2>/dev/null || true
            DEDUP_FAIL=1
          fi

          # Check no duplicate canonical_ids
          DUPES=$(sqlite3 "$DB_FILE" "SELECT canonical_id, COUNT(*) FROM custom_items GROUP BY canonical_id HAVING COUNT(*) > 1;" 2>/dev/null || echo "")
          if [ -z "$DUPES" ]; then
            echo "PASS: No duplicate canonical_ids"
          else
            echo "FAIL: Duplicate canonical_ids found: $DUPES"
            DEDUP_FAIL=1
          fi

          # Check the overlapping item (DIAMOND_SWORD:10001) has multiple discovery methods
          METHODS=$(sqlite3 "$DB_FILE" "SELECT discovery_methods FROM custom_items WHERE model_data_key = 'DIAMOND_SWORD:10001';" 2>/dev/null || echo "")
          echo "Discovery methods for overlapping item: $METHODS"
          if echo "$METHODS" | grep -q "PLUGIN_API_ITEMSADDER" && echo "$METHODS" | grep -q "PLUGIN_API_ORAXEN" && echo "$METHODS" | grep -q "PLUGIN_API_MMOITEMS"; then
            echo "PASS: Multiple discovery methods recorded for deduped item"
          else
            echo "FAIL: Expected 3 discovery methods for overlapping item, got: $METHODS"
            DEDUP_FAIL=1
          fi

          # Verify non-overlapping items each appear exactly once
          for id in itemsadder:emerald_pickaxe itemsadder:sapphire_helmet oraxen:obsidian_axe mmoitems:PICKAXE:VOID_PICK; do
            COUNT=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM custom_items WHERE canonical_id = '$id';" 2>/dev/null || echo "0")
            if [ "$COUNT" = "1" ]; then
              echo "PASS: Non-overlapping item '$id' appears exactly once"
            else
              echo "FAIL: Non-overlapping item '$id' appears $COUNT times (expected 1)"
              DEDUP_FAIL=1
            fi
          done
        else
          echo "FAIL: No SQLite DB file found"
          DEDUP_FAIL=1
        fi

        # Check for errors
        REAL_ERRORS=$(grep -i "Exception.*aurel\|Caused by:.*aurel" logs/latest.log 2>/dev/null | grep -vi "PLEASE RESTART\|zip file" || true)
        if [ -n "$REAL_ERRORS" ]; then
          echo "FAIL: Aurelium exceptions during dedup test"
          echo "$REAL_ERRORS"
          DEDUP_FAIL=1
        fi

        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true

        if [ "$DEDUP_FAIL" -ne 0 ]; then
          exit 1
        fi

    - name: Upload server log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: dedup-test-log
        path: logs/latest.log
        retention-days: 7

