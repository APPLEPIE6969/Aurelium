          fi
      - name: Op the test bot via RCON
        run: |
          sleep 3
          python3 << 'PYEOF_RCON'
import socket, struct
def rcon_read(sock):
    raw = b''
    while len(raw) < 4:
        chunk = sock.recv(4 - len(raw))
        if not chunk: return None
        raw += chunk
    l = struct.unpack('<i', raw[:4])[0]
    body_data = b''
