name: Build and Test

on:
  push:
    branches: ["1.4.3", main, "Latest", "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]
  pull_request:
    branches: ["1.4.3", main, "Latest", "fix/mysql-compat-and-auction-displayname", "feature/custom-item-scanner"]

permissions:
  contents: read

env:
  PAPER_26_BUILD: "65"
  PAPER_26_JAR_SHA: "cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2"
  PAPER_12111_BUILD: "69"
  PAPER_12111_JAR_SHA: "cf374f2af9d71dfcc75343f37b722a7abcb091c574131b95e3b13c6fc2cb8fae"
  VAULT_URL: "https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar"

jobs:
  # ===== 26.1.2 BUILD =====
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build 26.1.2 version
        run: ./gradlew :v26_1_2:shadowJar 2>&1 | tee build-26.1.2.log
      - name: Upload 26.1.2 JAR
        uses: actions/upload-artifact@v6
        with:
          name: Aurelium-26.1.2
          path: versions/26.1.2/build/libs/*.jar
      - name: Upload 26.1.2 build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-26.1.2-log
          path: build-26.1.2.log
          retention-days: 7

  # ===== 1.21.11 BUILD =====
  build-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build 1.21.11 version
        run: ./gradlew :v1_21_11:shadowJar 2>&1 | tee build-1.21.11.log
      - name: Upload 1.21.11 JAR
        uses: actions/upload-artifact@v6
        with:
          name: Aurelium-1.21.11
          path: versions/1.21.11/build/libs/*.jar
      - name: Upload 1.21.11 build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-1.21.11-log
          path: build-1.21.11.log
          retention-days: 7

  # ===== 26.1.2 SMOKE TEST =====
  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v7
        with:
          name: Aurelium-26.1.2
          path: plugins
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Start server and run smoke test
        run: |
          echo "eula=true" > eula.txt
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
          SMOKE_FAIL=0
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Plugin loaded"
          else
            echo "FAIL: Plugin did not load"; SMOKE_FAIL=1
          fi
          if [ -f "plugins/Aurelium/database.db" ]; then
            echo "PASS: SQLite database file exists"
          else
            echo "FAIL: No .db file"; SMOKE_FAIL=1
          fi
          SCHEMA_VER=$(sqlite3 plugins/Aurelium/database.db "SELECT version FROM database_info LIMIT 1;" 2>/dev/null || echo "0")
          if [ "$SCHEMA_VER" = "2" ] || [ "$SCHEMA_VER" = "v2" ]; then
            echo "PASS: Schema v2"
          else
            echo "FAIL: Schema version '$SCHEMA_VER'"; SMOKE_FAIL=1
          fi
          for table in players player_balances auctions offline_earnings buy_orders price_history auction_offers custom_items database_info; do
            if sqlite3 plugins/Aurelium/database.db ".tables" 2>/dev/null | grep -qw "$table"; then
              echo "PASS: Table '$table' exists"
            else
              echo "FAIL: Table '$table' missing"; SMOKE_FAIL=1
            fi
          done
          if grep -qi "exception.*aurelium\|error.*aurelium" logs/latest.log 2>/dev/null; then
            REAL_ERR=$(grep -i "exception.*aurelium\|error.*aurelium" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART" || true)
            if [ -n "$REAL_ERR" ]; then echo "FAIL: Runtime exceptions"; echo "$REAL_ERR"; SMOKE_FAIL=1; fi
          else
            echo "PASS: No runtime exceptions"
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$SMOKE_FAIL" -ne 0 ]; then exit 1; fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-26-log
          path: logs/latest.log
          retention-days: 7

