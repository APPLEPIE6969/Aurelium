            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=paste-url-aurelium-26-1-2" 2>/dev/null || true
          if [ -f url-tmp/paste-url.zip ] && [ -s url-tmp/paste-url.zip ]; then
            cd url-tmp && unzip -o paste-url.zip 2>/dev/null && cd ..
            PASTE_URL=$(cat url-tmp/paste-url.txt 2>/dev/null | head -1 || echo "")
          fi
          if [ -n "$PASTE_URL" ]; then
            curl -sS -f -o artifact-tmp/Aurelium.jar "$PASTE_URL" && echo "paste.rs download succeeded" || echo "paste.rs download failed"
          else
            echo "No paste.rs URL available"
          fi
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Start server
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
      - name: Run smoke checks
        run: |
          SMOKE_FAIL=0
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Plugin loaded"
          else
            echo "FAIL: Plugin did not load"; SMOKE_FAIL=1
          fi
          if [ -f "plugins/Aurelium/database.db" ]; then
            echo "PASS: SQLite database file exists"
          else
            echo "FAIL: No .db file"; SMOKE_FAIL=1
          fi
          SCHEMA_VER=$(sqlite3 plugins/Aurelium/database.db "SELECT version FROM database_info LIMIT 1;" 2>/dev/null || echo "0")
          if [ "$SCHEMA_VER" = "3" ] || [ "$SCHEMA_VER" = "v3" ] || [ "$SCHEMA_VER" = "2" ] || [ "$SCHEMA_VER" = "v2" ]; then
            echo "PASS: Schema $SCHEMA_VER"
          else
            echo "FAIL: Schema version '$SCHEMA_VER'"; SMOKE_FAIL=1
          fi
          for table in players player_balances auctions offline_earnings buy_orders price_history auction_offers custom_items database_info; do
            if sqlite3 plugins/Aurelium/database.db ".tables" 2>/dev/null | grep -qw "$table"; then
              echo "PASS: Table '$table' exists"
            else
              echo "FAIL: Table '$table' missing"; SMOKE_FAIL=1
            fi
          done
          if grep -qi "exception.*aurelium\|error.*aurelium\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" 2>/dev/null; then
            echo "FAIL: Exceptions found in log"; SMOKE_FAIL=1
          fi
          exit $SMOKE_FAIL
      - name: Run RCON in-game tests
        run: python3 test_rcon.py
      - name: Dump server exceptions
        if: always()
        run: |
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          if [ -f logs/latest.log ]; then
            echo "=== Server exceptions ==="
            grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions found"
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; fi
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-ingame-log
          path: logs/latest.log
          retention-days: 7

  mysql-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Start MySQL container
        run: |
          docker run -d --name mysql-test \
            -e MYSQL_ROOT_PASSWORD=test \
            -e MYSQL_DATABASE=aurelium_test \
            -p 3306:3306 \
            mysql:8.0 \
            --default-authentication-plugin=mysql_native_password
          for i in $(seq 1 30); do
            if docker exec mysql-test mysqladmin ping -h localhost -ptest 2>/dev/null; then
              echo "MySQL ready!"
              docker exec mysql-test mysql -h localhost -ptest -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'test'; FLUSH PRIVILEGES;" 2>/dev/null || true
              break
            fi
            sleep 2
          done
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v8
        with:
          name: aurelium-26-1-2
          path: artifact-tmp
      - name: "Fallback: Download from paste.rs"
        if: failure()
        run: |
          mkdir -p artifact-tmp url-tmp
          echo "GitHub artifact download failed, trying paste.rs..."
          PASTE_URL=""
          curl -sS -f -o url-tmp/paste-url.zip -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=paste-url-aurelium-26-1-2" 2>/dev/null || true
          if [ -f url-tmp/paste-url.zip ] && [ -s url-tmp/paste-url.zip ]; then
            cd url-tmp && unzip -o paste-url.zip 2>/dev/null && cd ..
            PASTE_URL=$(cat url-tmp/paste-url.txt 2>/dev/null | head -1 || echo "")
          fi
          if [ -n "$PASTE_URL" ]; then
            curl -sS -f -o artifact-tmp/Aurelium.jar "$PASTE_URL" && echo "paste.rs download succeeded" || echo "paste.rs download failed"
          else
            echo "No paste.rs URL available"
          fi
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper 26.1.2
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_26_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_26_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Create MySQL config
        run: |
          mkdir -p plugins/Aurelium
          cat > plugins/Aurelium/config.yml << 'CONFIG'
          database:
            type: mysql
            mysql:
              host: "127.0.0.1"
              port: 3306
              database: "aurelium_test"
              username: "root"
              password: "test"
          CONFIG
      - name: Start server and run RCON tests
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 90); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started!"; break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"; cat logs/latest.log | tail -40; kill $SERVER_PID 2>/dev/null || true; exit 1
          fi
          python3 test_rcon.py
          RC=$?
          cp logs/latest.log logs/pre-shutdown.log 2>/dev/null || true
          echo "=== Server exceptions ==="
          grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No exceptions"
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          exit $RC
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-test-log
          path: logs/latest.log
          retention-days: 7

