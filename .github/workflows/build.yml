          fi
          sleep 5
          python3 test_rcon.py
          RCON_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$RCON_EXIT" -ne 0 ]; then exit 1; fi
