            if [ -n "$REAL_ERR" ]; then echo "FAIL: Runtime exceptions"; echo "$REAL_ERR"; SMOKE_FAIL=1; fi
          else
            echo "PASS: No runtime exceptions"
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$SMOKE_FAIL" -ne 0 ]; then exit 1; fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-12111-log
          path: logs/latest.log
          retention-days: 7

  # ===== 26.1.2 CLOUD REGISTRATION TEST =====
  cloud-registration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium 26.1.2
        uses: actions/download-artifact@v7
        with:
          name: Aurelium-26.1.2
          path: plugins
      - name: Download Vault
