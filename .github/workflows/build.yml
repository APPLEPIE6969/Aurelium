name: Build Aurelium

on:
  push:
    branches: ["1.4.2-26.1.2", main]
  pull_request:
    branches: ["1.4.2-26.1.2", main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aurelium
          path: build/libs/*.jar

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download Paper 26.1.2
        run: |
          curl -sL "https://fill-data.papermc.io/v1/objects/6934188878fc351e1be5bfba5f2b8c4591224886e4b34e3de09dbec68a351caf/paper-26.1.2-53.jar" -o paper.jar
          ls -lh paper.jar

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins/

      - name: Accept EULA
        run: |
          echo "eula=true" > eula.txt

      - name: Start Paper server with plugin
        timeout-minutes: 5
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx512M -Xms512M \
            -jar paper.jar --nogui \
            --max-players=1 &
          SERVER_PID=$!

          TIMEOUT=120
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started successfully!"
              break
            fi
            if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
              echo "Server failed to start"
              tail -50 logs/latest.log
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Server did not start within ${TIMEOUT}s"
            tail -30 logs/latest.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Save pre-shutdown log to separate file for exception scan
          cp logs/latest.log logs/pre-shutdown.log

          # Verify plugin loaded
          echo ""
          echo "=== Plugin Load Verification ==="
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Aurelium plugin loaded successfully!"
          elif grep -q "Aurelium" logs/latest.log 2>/dev/null; then
            echo "WARN: Aurelium mentioned in log but may have errors"
            grep -i "aurelium\|error\|exception" logs/latest.log | tail -10
          else
            echo "FAIL: Aurelium not found in log"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Verify no Aurelium exceptions BEFORE shutdown
          # (shutdown causes benign zip-file-closed errors from async tasks)
          echo ""
          echo "=== Exception Scan (pre-shutdown) ==="
          if grep -qi "Exception.*aurel\|Error.*aurel\|Caused by:.*aurel" logs/pre-shutdown.log 2>/dev/null; then
            echo "FAIL: Aurelium exceptions found during runtime"
            grep -i "exception.*aurel\|caused by.*aurel" logs/pre-shutdown.log | tail -20
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          else
            echo "PASS: No Aurelium exceptions during runtime"
          fi

          # Verify database and config
          echo ""
          echo "=== Database & Config ==="
          if ls plugins/Aurelium/*.db 2>/dev/null; then
            echo "PASS: SQLite database file exists"
          else
            echo "SKIP: No .db file found in plugins/Aurelium/"
          fi
          if [ -f plugins/Aurelium/config.yml ]; then
            echo "PASS: config.yml generated"
          else
            echo "FAIL: config.yml not found"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          if [ -f plugins/Aurelium/messages.yml ]; then
            echo "PASS: messages.yml generated"
          else
            echo "SKIP: messages.yml not generated on first run"
          fi

          # Shutdown server gracefully
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: logs/latest.log
          retention-days: 7

      - name: Upload plugin data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-data
          path: plugins/Aurelium/
          retention-days: 7
