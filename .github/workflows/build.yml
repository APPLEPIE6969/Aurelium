name: Build and Test

on:
  push:
    branches: ["1.4.2-26.1.2", main]
  pull_request:
    branches: ["1.4.2-26.1.2", main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aurelium
          path: build/libs/*.jar

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Paper 26.1.2 build 61
        run: |
          curl -sL "https://fill-data.papermc.io/v1/objects/980421a4f9c4b26f15a9d2fddd7fc91125fd91320d21e189d4504e70893a79e5/paper-26.1.2-61.jar" -o paper.jar
          ls -lh paper.jar
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins/
      - name: Accept EULA
        run: |
          echo "eula=true" > eula.txt
      - name: Start Paper server with plugin
        timeout-minutes: 5
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx512M -Xms512M \
            -jar paper.jar --nogui \
            --max-players=5 &
          SERVER_PID=$!

          TIMEOUT=120
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started successfully!"
              break
            fi
            if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
              echo "Server failed to start"
              tail -50 logs/latest.log
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Server did not start within ${TIMEOUT}s"
            tail -30 logs/latest.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "=== Plugin Load Verification ==="
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Aurelium plugin loaded successfully!"
          elif grep -q "Aurelium" logs/latest.log 2>/dev/null; then
            echo "WARN: Aurelium mentioned in log but may have errors"
            grep -i "aurelium\|error\|exception" logs/latest.log | tail -10
          else
            echo "FAIL: Aurelium not found in log"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "=== Database & Config ==="
          if ls plugins/Aurelium/*.db 2>/dev/null; then
            echo "PASS: SQLite database file exists"
          else
            echo "SKIP: No .db file found"
          fi
          if [ -f plugins/Aurelium/config.yml ]; then
            echo "PASS: config.yml generated"
          else
            echo "FAIL: config.yml not found"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          cp logs/latest.log logs/pre-shutdown.log
          REAL_ERRORS=$(grep -i "Exception.*aurel\|Caused by:.*aurel" logs/pre-shutdown.log 2>/dev/null | grep -vi "PLEASE RESTART\|zip file" || true)
          if [ -n "$REAL_ERRORS" ]; then
            echo "FAIL: Aurelium exceptions found during runtime"
            echo "$REAL_ERRORS"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          else
            echo "PASS: No Aurelium exceptions during runtime"
          fi

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: logs/latest.log
          retention-days: 7

      - name: Upload plugin data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-data
          path: plugins/Aurelium/
          retention-days: 7

  ingame-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Paper 26.1.2 build 61
        run: |
          curl -sL "https://fill-data.papermc.io/v1/objects/980421a4f9c4b26f15a9d2fddd7fc91125fd91320d21e189d4504e70893a79e5/paper-26.1.2-61.jar" -o paper.jar
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins/
      - name: Accept EULA and configure server
        run: |
          echo "eula=true" > eula.txt
          printf "online-mode=false\nmax-players=5\nserver-port=25565\n" > server.properties
      - name: Start Paper server (first run)
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx768M -Xms768M \
            -jar paper.jar --nogui \
            --max-players=5 &
          SERVER_PID=$!

          TIMEOUT=150
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server ready on first run!"
              break
            fi
            if grep -q "Failed to start" logs/latest.log 2>/dev/null; then
              echo "Server failed to start"
              tail -50 logs/latest.log
              kill $SERVER_PID 2>/dev/null
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Server did not start in time"
            tail -30 logs/latest.log
            kill $SERVER_PID 2>/dev/null
            exit 1
          fi

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          sleep 3

          sed -i 's/online-mode=true/online-mode=false/g' server.properties
          sed -i '/^enable-rcon=/d; /^rcon\./d' server.properties
          printf "\nenable-rcon=true\nrcon.port=25575\nrcon.password=testpass\n" >> server.properties
          grep "online-mode\|rcon" server.properties
      - name: Restart Paper server with RCON
        run: |
          java -Dpaper.playerconnection.keepalive=60 \
            -Xmx768M -Xms768M \
            -jar paper.jar --nogui \
            --max-players=5 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/server_pid

          TIMEOUT=90
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server restarted with RCON!"
              break
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Server did not restart in time"
            tail -30 logs/latest.log
            kill $SERVER_PID 2>/dev/null
            exit 1
          fi

          echo "Waiting for RCON port 25575..."
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 25575 2>/dev/null; then
              echo "RCON port 25575 is open!"
              break
            fi
            sleep 1
          done
          sleep 3
      - name: Write RCON test script
        run: |
          cat > test_rcon.py << 'PYEOF'
          import socket
          import struct
          import sys
          import re

          def rcon(host, port, password, command):
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(10)
              sock.connect((host, port))
              _send_packet(sock, 3, password)
              req_id, resp = _receive_packet(sock)
              if req_id == -1:
                  print("RCON auth failed!")
                  sock.close()
                  return None
              _send_packet(sock, 2, command)
              req_id, resp = _receive_packet(sock)
              sock.close()
              return resp

          def _send_packet(sock, req_type, data):
              packet = struct.pack('<ii', req_type, req_type) + data.encode('utf-8') + b'\x00\x00'
              length = len(packet)
              sock.send(struct.pack('<i', length) + packet)

          def _receive_packet(sock):
              length = struct.unpack('<i', sock.recv(4))[0]
              data = b''
              while len(data) < length:
                  chunk = sock.recv(length - len(data))
                  if not chunk:
                      break
                  data += chunk
              req_id = struct.unpack('<i', data[:4])[0]
              resp = data[8:-2].decode('utf-8', errors='replace')
              return req_id, resp

          HOST = '127.0.0.1'
          PORT = 25575
          PASS = 'testpass'

          passed = 0
          failed = 0

          def assert_test(name, condition, detail=''):
              global passed, failed
              if condition:
                  print(f'  PASS: {name}')
                  passed += 1
              else:
                  print(f'  FAIL: {name} {detail}')
                  failed += 1

          def run_cmd(cmd):
              resp = rcon(HOST, PORT, PASS, cmd)
              if resp is None:
                  print(f'  ERROR: RCON failed for: {cmd}')
              else:
                  clean = re.sub(r'\u00a7[0-9a-fk-or]', '', resp)
                  print(f'  RCON [{cmd}] -> {clean[:200]}')
              return resp or ''

          def strip_color(text):
              return re.sub(r'\u00a7[0-9a-fk-or]', '', text)

          print('=== Aurelium In-Game Tests ===\n')
          print('--- /bal command ---\n')

          # TEST 1: /bal without player (console must specify)
          print('Test 1: /bal (console must specify player)')
          resp = strip_color(run_cmd('bal'))
          assert_test('/bal responds', len(resp) > 0, f'len={len(resp)}')

          # TEST 2: /bal TestPlayer (async, acknowledges request)
          print('\nTest 2: /bal TestPlayer')
          resp = strip_color(run_cmd('bal TestPlayer'))
          assert_test('/bal acknowledges', 'Checking' in resp or 'Balance' in resp or 'balance' in resp or 'TestPlayer' in resp, f'resp={resp[:100]}')

          # TEST 3: /bal TestPlayer Aurels (with currency)
          print('\nTest 3: /bal TestPlayer Aurels')
          resp = strip_color(run_cmd('bal TestPlayer Aurels'))
          assert_test('/bal with currency acknowledges', 'Checking' in resp or 'Balance' in resp or 'balance' in resp or 'TestPlayer' in resp or 'Aurels' in resp, f'resp={resp[:100]}')

          print('\n--- /eco admin command ---\n')

          # TEST 4: /eco give
          print('Test 4: /eco give TestPlayer 500')
          resp = strip_color(run_cmd('eco give TestPlayer 500'))
          assert_test('/eco give responds', len(resp) > 0)
          assert_test('/eco give confirms', 'Gave' in resp or 'gave' in resp or '500' in resp, f'resp={resp[:100]}')

          # TEST 5: /eco take
          print('\nTest 5: /eco take TestPlayer 200')
          resp = strip_color(run_cmd('eco take TestPlayer 200'))
          assert_test('/eco take confirms', 'Took' in resp or 'took' in resp or '200' in resp, f'resp={resp[:100]}')

          # TEST 6: /eco set
          print('\nTest 6: /eco set TestPlayer 1000')
          resp = strip_color(run_cmd('eco set TestPlayer 1000'))
          assert_test('/eco set confirms', 'Set' in resp or 'set' in resp or '1000' in resp, f'resp={resp[:100]}')

          # TEST 7: /eco with specific currency
          print('\nTest 7: /eco give TestPlayer 50 Aurels')
          resp = strip_color(run_cmd('eco give TestPlayer 50 Aurels'))
          assert_test('/eco with currency works', 'Gave' in resp or 'gave' in resp or '50' in resp or 'Aurels' in resp, f'resp={resp[:100]}')

          # TEST 8: /eco invalid currency
          print('\nTest 8: /eco give TestPlayer 50 InvalidCoin')
          resp = strip_color(run_cmd('eco give TestPlayer 50 InvalidCoin'))
          assert_test('/eco rejects invalid currency', 'Invalid' in resp or 'invalid' in resp, f'resp={resp[:100]}')

          # TEST 9: /eco invalid action
          print('\nTest 9: /eco burn TestPlayer 100')
          resp = strip_color(run_cmd('eco burn TestPlayer 100'))
          assert_test('/eco rejects invalid action', 'Unknown' in resp or 'Usage' in resp, f'resp={resp[:100]}')

          # TEST 10: /eco negative amount
          print('\nTest 10: /eco give TestPlayer -100')
          resp = strip_color(run_cmd('eco give TestPlayer -100'))
          assert_test('/eco rejects negative', 'positive' in resp.lower() or 'Positive' in resp, f'resp={resp[:100]}')

          # TEST 11: /eco non-numeric amount
          print('\nTest 11: /eco give TestPlayer abc')
          resp = strip_color(run_cmd('eco give TestPlayer abc'))
          assert_test('/eco rejects non-numeric', 'Invalid' in resp or 'invalid' in resp, f'resp={resp[:100]}')

          # TEST 12: /eco missing args
          print('\nTest 12: /eco give TestPlayer')
          resp = strip_color(run_cmd('eco give TestPlayer'))
          assert_test('/eco rejects missing amount', 'Usage' in resp or 'Invalid' in resp or len(resp) > 0, f'resp={resp[:100]}')

          print('\n--- /pay command (console) ---\n')

          # TEST 13: /pay from console (player-only)
          print('Test 13: /pay TestPlayer 50')
          resp = strip_color(run_cmd('pay TestPlayer 50'))
          assert_test('/pay rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          print('\n--- /market command (console) ---\n')

          # TEST 14: /market from console (player-only GUI)
          print('Test 14: /market')
          resp = strip_color(run_cmd('market'))
          assert_test('/market rejects console', 'player' in resp.lower() or len(resp) > 0, f'resp={resp[:100]}')

          print('\n--- /stocks command (console) ---\n')

          # TEST 15: /stocks from console (player-only GUI)
          print('Test 15: /stocks')
          resp = strip_color(run_cmd('stocks'))
          assert_test('/stocks rejects console', 'player' in resp.lower() or len(resp) > 0, f'resp={resp[:100]}')

          print('\n--- /web command (console) ---\n')

          # TEST 16: /web from console (player-only)
          print('Test 16: /web')
          resp = strip_color(run_cmd('web'))
          assert_test('/web rejects console', 'player' in resp.lower() or len(resp) > 0, f'resp={resp[:100]}')

          print('\n--- /ah command (console) ---\n')

          # TEST 17: /ah from console (player-only)
          print('Test 17: /ah')
          resp = strip_color(run_cmd('ah'))
          assert_test('/ah rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          # TEST 18: /ah sell from console
          print('\nTest 18: /ah sell 100')
          resp = strip_color(run_cmd('ah sell 100'))
          assert_test('/ah sell rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          # TEST 19: /ah collect from console
          print('\nTest 19: /ah collect')
          resp = strip_color(run_cmd('ah collect'))
          assert_test('/ah collect rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          # TEST 20: /ah search from console
          print('\nTest 20: /ah search diamond')
          resp = strip_color(run_cmd('ah search diamond'))
          assert_test('/ah search rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          print('\n--- /orders command (console) ---\n')

          # TEST 21: /orders from console (player-only)
          print('Test 21: /orders')
          resp = strip_color(run_cmd('orders'))
          assert_test('/orders rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          # TEST 22: /orders create from console
          print('\nTest 22: /orders create DIAMOND 10 5')
          resp = strip_color(run_cmd('orders create DIAMOND 10 5'))
          assert_test('/orders create rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          # TEST 23: /orders my from console
          print('\nTest 23: /orders my')
          resp = strip_color(run_cmd('orders my'))
          assert_test('/orders my rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          # TEST 24: /orders search from console
          print('\nTest 24: /orders search diamond')
          resp = strip_color(run_cmd('orders search diamond'))
          assert_test('/orders search rejects console', 'Only players' in resp or 'player' in resp.lower(), f'resp={resp[:100]}')

          # Cleanup
          run_cmd('eco set TestPlayer 100')

          print('\n========== RESULTS ==========')
          print(f'Passed: {passed}')
          print(f'Failed: {failed}')
          print('==============================')

          sys.exit(1 if failed > 0 else 0)
          PYEOF
      - name: Run in-game tests via RCON
        timeout-minutes: 3
        run: |
          python3 test_rcon.py
          TEST_EXIT=$?
          echo "Test exit code: $TEST_EXIT"
          grep -i "aurel\|economy\|issued server command" logs/latest.log | tail -30 || true
          kill $(cat /tmp/server_pid) 2>/dev/null || true
          wait $(cat /tmp/server_pid) 2>/dev/null || true
          exit $TEST_EXIT
