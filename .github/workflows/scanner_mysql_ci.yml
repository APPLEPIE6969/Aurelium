name: Scanner MySQL CI Tests

on:
  push:
    branches: ["Latest", "feature/custom-item-scanner"]
  pull_request:
    branches: ["Latest", "feature/custom-item-scanner"]

permissions:
  contents: read

env:
  PAPER_BUILD: "69"
  PAPER_JAR_SHA: "d30fae0c74092b10855f0412ca6b265c60301a013d34bc28a2a41bf5682dd80b"
  VAULT_URL: "https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload JAR
      uses: actions/upload-artifact@v7
      with:
        name: Aurelium-Scanner
        path: build/libs/*.jar

  mysql-dedup-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Start MySQL container
      run: |
        docker run -d --name mysql-scanner \
          -e MYSQL_ROOT_PASSWORD=test \
          -e MYSQL_DATABASE=aurelium_test \
          -p 3306:3306 \
          mysql:8.0 \
          --default-authentication-plugin=mysql_native_password
        for i in $(seq 1 30); do
          if docker exec mysql-scanner mysqladmin ping -h localhost -ptest 2>/dev/null; then
            echo "MySQL ready!"
            docker exec mysql-scanner mysql -h localhost -ptest -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'test'; FLUSH PRIVILEGES;" 2>/dev/null || true
            break
          fi
          sleep 2
        done
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Download Aurelium
      uses: actions/download-artifact@v8
      with:
        name: Aurelium-Scanner
        path: artifact-tmp
    - name: Move JAR to plugins folder
      run: |
        mkdir -p plugins
        find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
        echo "Contents of plugins/:"
        ls -la plugins/
    - name: Build mock plugins
      run: |
        for dir in ci/mock-itemsadder ci/mock-oraxen ci/mock-mmoitems; do
          echo "Building $dir..."
          cd "$dir"
          chmod +x gradlew 2>/dev/null || true
          if [ -f "gradlew" ]; then
            ./gradlew build 2>&1 || gradle build 2>&1 || echo "WARN: Failed to build $dir"
          else
            gradle build 2>&1 || echo "WARN: Failed to build $dir (no gradlew)"
          fi
          if ls build/libs/*.jar 1>/dev/null 2>&1; then
            cp build/libs/*.jar ../../plugins/
            echo "OK: Built $dir"
          else
            echo "WARN: No JAR from $dir, skipping"
          fi
          cd ../..
        done
        ls -la plugins/
    - name: Download Vault
      run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
    - name: Download Paper
      run: |
        PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
        curl -sL "$PAPER_URL" -o paper.jar
        if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
    - name: Test MySQL dedup
      run: |
        mkdir -p plugins/Aurelium
        cat > plugins/Aurelium/config.yml << 'CFG'
        database:
          type: mysql
          mysql:
            host: 127.0.0.1
            port: 3306
            database: aurelium_test
            username: root
            password: test
        CFG
        echo "eula=true" > eula.txt
        cat > server.properties << 'PROPS'
        online-mode=false
        server-port=25565
        enable-rcon=true
        rcon.port=25575
        rcon.password=test
        PROPS
        timeout 120 java -jar paper.jar --nogui &
        SERVER_PID=$!
        for i in $(seq 1 60); do
          if grep -q "Done (" logs/latest.log 2>/dev/null; then break; fi
          sleep 2
        done
        if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
          echo "Server failed to start"
          cat logs/latest.log 2>/dev/null | tail -50 || true
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi
        sleep 10
        FAIL=0
        TOTAL=$(mysql -h 127.0.0.1 -u root -ptest aurelium_test -N -e "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
        echo "MySQL dedup test: $TOTAL items"
        DUP_IDS=$(mysql -h 127.0.0.1 -u root -ptest aurelium_test -N -e "SELECT canonical_id FROM custom_items GROUP BY canonical_id HAVING COUNT(*) > 1;" 2>/dev/null || true)
        if [ -z "$DUP_IDS" ]; then
          echo "PASS: No MySQL duplicate canonical_ids"
        else
          echo "FAIL: MySQL duplicates: $DUP_IDS"
          FAIL=1
        fi
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        if [ "$FAIL" -ne 0 ]; then exit 1; fi
    - name: Upload server log on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: scanner-mysql-test-log
        path: logs/latest.log
        retention-days: 7
