name: Scanner MySQL CI Tests

on:
  push:
    branches: ["feature/custom-item-scanner"]
  pull_request:
    branches: ["feature/custom-item-scanner"]

permissions:
  contents: read

env:
  PAPER_BUILD: "65"
  PAPER_JAR_SHA: "cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aurelium
          path: build/libs/*.jar

  mysql-dedup-test:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: aurelium_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build mock plugins
        run: |
          for dir in ci/mock-itemsadder ci/mock-oraxen ci/mock-mmoitems; do
            cd "$dir"
            gradle build 2>/dev/null || ./gradlew build 2>/dev/null || true
            cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
            cd ../..
          done
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then echo "FAIL: paper.jar empty"; exit 1; fi
      - name: Test MySQL dedup
        run: |
          mkdir -p plugins/Aurelium
          cat > plugins/Aurelium/config.yml << 'CFG'
          database:
            type: mysql
            host: 127.0.0.1
            port: 3306
            name: aurelium_test
            username: root
            password: test
          CFG
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 10
          FAIL=0
          TOTAL=$(mysql -h 127.0.0.1 -u root -ptest aurelium_test -N -e "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
          echo "MySQL dedup test: $TOTAL items"
          DUP_IDS=$(mysql -h 127.0.0.1 -u root -ptest aurelium_test -N -e "SELECT canonical_id FROM custom_items GROUP BY canonical_id HAVING COUNT(*) > 1;" 2>/dev/null || true)
          if [ -z "$DUP_IDS" ]; then
            echo "PASS: No MySQL duplicate canonical_ids"
          else
            echo "FAIL: MySQL duplicates: $DUP_IDS"
            FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
