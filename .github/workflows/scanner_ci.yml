name: Scanner CI Tests

on:
  push:
    branches: ["feature/custom-item-scanner"]
  pull_request:
    branches: ["feature/custom-item-scanner"]

permissions:
  contents: read

env:
  PAPER_BUILD: "65"
  PAPER_JAR_SHA: "cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aurelium
          path: build/libs/*.jar

  executableitems-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build mock-executableitems
        run: |
          cd ci/mock-executableitems
          mkdir -p gradle/wrapper
          cp ../../gradle/wrapper/gradle-wrapper.jar gradle/wrapper/ 2>/dev/null || true
          gradle build || ./gradlew build 2>/dev/null || true
          cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start server and test ExecutableItems scan
        run: |
          mkdir -p plugins
          ls -la plugins/
          echo "eula=true" > eula.txt
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          EI_FAIL=0
          if grep -q "\[CustomItems\].*ExecutableItems scan complete" logs/latest.log 2>/dev/null; then
            echo "PASS: ExecutableItems scan ran"
          else
            echo "FAIL: ExecutableItems scan did not run"
            EI_FAIL=1
          fi
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            EI_COUNT=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT COUNT(*) FROM custom_items WHERE source_plugin='ExecutableItems';" 2>/dev/null || echo "0")
            if [ "$EI_COUNT" -ge 2 ]; then
              echo "PASS: Found $EI_COUNT ExecutableItems items in DB"
            else
              echo "FAIL: Expected 2 ExecutableItems items, got $EI_COUNT"
              EI_FAIL=1
            fi
          else
            echo "FAIL: No SQLite DB found"
            EI_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$EI_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ei-test-log
          path: logs/latest.log
          retention-days: 7

  inventory-scan-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build mock-inventory-giver
        run: |
          cd ci/mock-inventory-giver
          gradle build || ./gradlew build 2>/dev/null || true
          cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start server and test inventory scan
        run: |
          mkdir -p plugins
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          SCAN_FAIL=0
          if grep -q "\[CustomItems\].*inventory" logs/latest.log 2>/dev/null; then
            echo "PASS: Inventory scan ran"
          else
            echo "INFO: Inventory scan may not have triggered (no online players in CI)"
          fi
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            echo "PASS: SQLite DB exists"
          else
            echo "FAIL: No SQLite DB found"
            SCAN_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$SCAN_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-scan-log
          path: logs/latest.log
          retention-days: 7

  interaction-detect-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build mock-interaction-giver
        run: |
          cd ci/mock-interaction-giver
          gradle build || ./gradlew build 2>/dev/null || true
          cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start server and test interaction detect
        run: |
          mkdir -p plugins
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25577" >> server.properties
          echo "rcon.password=test" >> server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          INTERACT_FAIL=0
          if grep -q "interaction-detect" logs/latest.log 2>/dev/null; then
            echo "PASS: Interaction detect mentioned in log"
          else
            echo "INFO: Interaction detect not explicitly logged (may be default enabled)"
          fi
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            echo "PASS: SQLite DB exists"
          else
            echo "FAIL: No SQLite DB found"
            INTERACT_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$INTERACT_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-detect-log
          path: logs/latest.log
          retention-days: 7

  rescan-idempotency-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Build mock-itemsadder
        run: |
          cd ci/mock-itemsadder
          gradle build || ./gradlew build 2>/dev/null || true
          cp build/libs/*.jar ../../plugins/ 2>/dev/null || true
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Test rescan idempotency
        run: |
          mkdir -p plugins
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25578" >> server.properties
          echo "rcon.password=test" >> server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "First startup timed out"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 10
          FIRST_COUNT=0
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            FIRST_COUNT=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
          fi
          echo "First scan: $FIRST_COUNT items"
          sleep 5
          SECOND_COUNT=$FIRST_COUNT
          if [ -f "plugins/Aurelium/aurelium.db" ]; then
            SECOND_COUNT=$(sqlite3 plugins/Aurelium/aurelium.db "SELECT COUNT(*) FROM custom_items;" 2>/dev/null || echo "0")
          fi
          echo "After rescan: $SECOND_COUNT items"
          RESCAN_FAIL=0
          if [ "$FIRST_COUNT" -gt 0 ]; then
            echo "PASS: Items found after first scan"
          else
            echo "FAIL: No items found after first scan"
            RESCAN_FAIL=1
          fi
          if [ "$SECOND_COUNT" -le "$FIRST_COUNT" ]; then
            echo "PASS: Rescan is idempotent ($FIRST_COUNT -> $SECOND_COUNT)"
          else
            echo "FAIL: Rescan created duplicates ($FIRST_COUNT -> $SECOND_COUNT)"
            RESCAN_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$RESCAN_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rescan-idempotency-log
          path: logs/latest.log
          retention-days: 7

  error-recovery-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Aurelium
        uses: actions/download-artifact@v4
        with:
          name: Aurelium
          path: plugins
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Test scanner error recovery
        run: |
          mkdir -p plugins
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then break; fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          ERR_FAIL=0
          if grep -qi "Exception.*scanner\|Error.*scanner" logs/latest.log 2>/dev/null; then
            REAL_ERR=$(grep -i "Exception.*scanner\|Error.*scanner" logs/latest.log 2>/dev/null | grep -vi "skipping\|not found\|ClassNotFoundException\|NoClassDefFound" || true)
            if [ -n "$REAL_ERR" ]; then
              echo "FAIL: Scanner errors detected"
              echo "$REAL_ERR"
              ERR_FAIL=1
            else
              echo "PASS: Scanner handled missing plugins gracefully"
            fi
          else
            echo "PASS: No scanner errors in log"
          fi
          if grep -q "AurelEconomy has been enabled" logs/latest.log 2>/dev/null; then
            echo "PASS: Plugin loaded successfully"
          else
            echo "FAIL: Plugin did not load"
            ERR_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$ERR_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-recovery-log
          path: logs/latest.log
          retention-days: 7
