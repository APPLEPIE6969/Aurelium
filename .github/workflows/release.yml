name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Build and Test", "Mineflayer In-Game Tests", "Scanner MySQL CI Tests"]
    types: [completed]
    branches: ["Latest"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.5.0" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog from patchnotes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [ -f patchnotes.md ]; then
            # Extract the section for this version (from ## vVERSION to the next ## or ---)
            CHANGELOG=$(awk "/^## v${VERSION}/,/^## v[^${VERSION:0:1}]/" patchnotes.md | head -n -1 | sed '/^---$/d')
            if [ -z "$CHANGELOG" ]; then
              # Fallback: grab everything from ## vVERSION to the next ---
              CHANGELOG=$(sed -n "/^## v${VERSION}/,/^---$/p" patchnotes.md | sed '/^---$/d')
            fi
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="See patchnotes.md for details."
            fi
          else
            CHANGELOG="See commit history for details."
          fi
          # Write to file for multiline output
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "Extracted changelog for v${VERSION}: $(wc -l < /tmp/changelog.txt) lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Aurelium v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            build/libs/*.jar
          body_path: /tmp/changelog.txt
