name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build all versions
        run: ./gradlew :v26_1_2:shadowJar :v1_21_11:shadowJar

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog from patchnotes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [ -f patchnotes.md ]; then
            # Extract only the section for this exact version:
            # From the line starting with "## vVERSION" up to (but not including)
            # the next line starting with "## v" or the "---" separator
            CHANGELOG=$(awk -v ver="v${VERSION}" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## v/ { found=0 }
            found && /^---$/ { found=0 }
            found { print }
            ' patchnotes.md)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="See patchnotes.md for details."
            fi
          else
            CHANGELOG="See commit history for details."
          fi
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "Extracted changelog for v${VERSION}: $(wc -l < /tmp/changelog.txt) lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Aurelium v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            versions/26.1.2/build/libs/*.jar
            versions/1.21.11/build/libs/*.jar
          body_path: /tmp/changelog.txt
