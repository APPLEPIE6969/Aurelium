name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Built to prove the tagged commit still compiles, not to be uploaded.
      # This is the only workflow that runs on tags, since build.yml triggers on
      # branch pushes, so removing this step would leave a tag unverified.
      - name: Verify the tag builds
        run: ./gradlew :v26_2:shadowJar :v26_1_2:shadowJar :v1_21_11:shadowJar

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Downloads live on Modrinth, which is the only place jars are published.
      # This release is a pointer to it, so the body opens with the link.
      #
      # The detail below comes from patchnotes.md rather than changelog.md on
      # purpose. GitHub is the developer-facing surface, so it gets the
      # format-by-format notes. Modrinth is where server owners read the
      # plain-language changelog instead.
      - name: Build the release body
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [ -f patchnotes.md ]; then
            # Extract only the section for this exact version:
            # From the line starting with "## vVERSION" up to (but not including)
            # the next line starting with "## v" or the "---" separator
            CHANGELOG=$(awk -v ver="v${VERSION}" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## v/ { found=0 }
            found && /^---$/ { found=0 }
            found { print }
            ' patchnotes.md)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="See patchnotes.md for details."
            fi
          else
            CHANGELOG="See commit history for details."
          fi

          {
            echo "## Download"
            echo
            echo "Jars are published on Modrinth and are not attached to this release:"
            echo
            echo "https://modrinth.com/plugin/aurelium/versions"
            echo
            echo "Pick the file that matches your Minecraft version:"
            echo
            echo "| File | Minecraft version | Needs Java |"
            echo "|---|---|---|"
            echo "| \`Aurelium-${VERSION}-1.21.x.jar\` | 1.21 through 1.21.11 | 21 |"
            echo "| \`Aurelium-${VERSION}-26.1.x.jar\` | 26.1, 26.1.1, 26.1.2 | 25 |"
            echo "| \`Aurelium-${VERSION}-26.2.x.jar\` | 26.2 | 25 |"
            echo
            echo "## Changes"
            echo
            echo "$CHANGELOG"
          } > /tmp/changelog.txt

          echo "Wrote release body: $(wc -l < /tmp/changelog.txt) lines"

      # No files are attached. Attaching the jars here meant GitHub and Modrinth
      # could serve different builds of the same version, because the two are not
      # built in the same environment and jars are not byte reproducible.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Aurelium v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          body_path: /tmp/changelog.txt