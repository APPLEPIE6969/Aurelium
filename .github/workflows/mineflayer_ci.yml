name: Mineflayer Ingame Tests
on:
  push:
    branches: [main, Latest, feature/custom-item-scanner]
  pull_request:
    branches: [main, Latest, feature/custom-item-scanner]
  workflow_dispatch:

jobs:
  mineflayer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build plugin
        run: ./gradlew build -x test

      - name: Cache Paper and plugins
        uses: actions/cache@v4
        with:
          path: server-data
          key: paper-26.1.2-${{ hashFiles('build.gradle.kts') }}

      - name: Start Minecraft Paper 26.1.2 server
        run: |
          mkdir -p server-data && cd server-data
          if [ ! -f paper.jar ]; then
            curl -sL "$PAPER_URL" -o paper.jar
            ls -lh paper.jar
            if [ ! -s paper.jar ]; then echo "FAIL: paper.jar is empty or missing"; exit 1; fi
          fi
          if [ ! -f plugins/Vault.jar ]; then
            curl -sL "$VAULT_URL" -o plugins/Vault.jar
          fi
          if [ ! -f plugins/ViaVersion.jar ]; then
            curl -sL "$VIAVERSION_URL" -o plugins/ViaVersion.jar
          fi
          if [ ! -f plugins/ViaBackwards.jar ]; then
            curl -sL "$VIABACKWARDS_URL" -o plugins/ViaBackwards.jar
          fi
          yes | cp ../build/libs/*.jar plugins/Aurelium.jar
          echo "eula=true" > eula.txt
          sed -i 's/^online-mode=.*/online-mode=false/' server.properties || true
          java -Xmx2G -jar paper.jar -"nogui" --noconsole &
          echo $! > server.pid
        env:
          PAPER_URL: https://fill-data.papermc.io/v1/objects/cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2/paper-26.1.2-65.jar
          PAPER_BUILD: 65
          PAPER_JAR_SHA: cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2
          VIAVERSION_URL: https://cdn.modrinth.com/data/P1OZGk5p/versions/6LC4R0sP/ViaVersion-5.9.2-SNAPSHOT.jar
          VIABACKWARDS_URL: https://cdn.modrinth.com/data/NpvuJQoq/versions/Og77hOkC/ViaBackwards-5.9.2-SNAPSHOT.jar
          VAULT_URL: https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar

      - name: Wait for server startup
        working-directory: server-data
        run: |
          for i in $(seq 1 120); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started successfully!"; exit 0; fi
            sleep 2
          done
          echo "FAIL: Server did not start within 4 minutes"
          cat logs/latest.log 2>/dev/null | tail -50
          kill $(cat server.pid 2>/dev/null) 2>/dev/null || true
          exit 1

      - name: Run Mineflayer tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install mineflayer@4.20.1
          node ../../mineflayer_test.js >TestBot-log.txt 2>&1
          node - <<'NODE'
          const fs=require('fs');
          const log=fs.readFileSync('TestBot-log.txt','utf8');
          const lines=log.split(/\r?\n/);
          let fail=0;
          for (const line of lines) {
            if (line.startsWith('FAIL:') || line.includes('Tests complete') || line.includes('failedTests')) console.log(line);
          }
          NODE
        working-directory: server-data

      - name: Dump server logs if tests failed
        if: failure()
        run: |
          echo '===== latest.log ====='
          tail -n 200 server-data/logs/latest.log || true
          echo '===== TestBot-log.txt ====='
          cat server-data/TestBot-log.txt || true

      - name: Stop server
        if: always()
        working-directory: server-data
        run: |
          kill $(cat server.pid 2>/dev/null) 2>/dev/null || true
          sleep 5
