name: Mineflayer In-Game Tests

on:
  push:
    branches: ["Latest", "feature/custom-item-scanner"]
  pull_request:
    branches: ["Latest", "feature/custom-item-scanner"]

permissions:
  contents: read

env:
  PAPER_BUILD: "69"
  PAPER_JAR_SHA: "d30fae0c74092b10855f0412ca6b265c60301a013d34bc28a2a41bf5682dd80b"
  VIAVERSION_URL: "https://cdn.modrinth.com/data/P1OZGk5p/versions/6LC4R0sP/ViaVersion-5.9.2-SNAPSHOT.jar"
  VIABACKWARDS_URL: "https://cdn.modrinth.com/data/NpvuJQoq/versions/Og77hOkC/ViaBackwards-5.9.2-SNAPSHOT.jar"
  VAULT_URL: "https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Aurelium-Mineflayer
          path: build/libs/*.jar

  mineflayer-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install mineflayer dependencies
        run: npm install --no-package-lock
        working-directory: .github/scripts
      - name: Download Aurelium
        uses: actions/download-artifact@v8
        with:
          name: Aurelium-Mineflayer
          path: artifact-tmp
      - name: Move JAR to plugins folder
        run: |
          mkdir -p plugins
          find artifact-tmp -name "*.jar" -type f -exec mv {} plugins/ \;
          echo "Contents of plugins/:"
          ls -la plugins/
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-26.1.2-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          ls -lh paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Download ViaVersion + ViaBackwards + Vault
        run: |
          curl -sL "${{ env.VIAVERSION_URL }}" -o plugins/ViaVersion.jar
          curl -sL "${{ env.VIABACKWARDS_URL }}" -o plugins/ViaBackwards.jar
          curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
          ls -lh plugins/
      - name: Configure and start server
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'PROPS'
          online-mode=false
          server-port=25565
          max-players=10
          gamemode=survival
          difficulty=peaceful
          enable-rcon=true
          rcon.port=25575
          rcon.password=test
          PROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 120); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started successfully!"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "FAIL: Server did not start within 4 minutes"
            cat logs/latest.log 2>/dev/null | tail -50 || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
      - name: Run in-game tests via RCON
        run: |
          node .github/scripts/mineflayer_test.js || true
          python3 .github/scripts/test_ingame_rcon.py
          RCON_EXIT=$?
          if [ "$RCON_EXIT" -ne 0 ]; then
            echo "FAIL: RCON in-game test failed"
            exit 1
          fi
          echo "RCON in-game test passed"
      - name: Dump server exceptions
        if: always()
        run: |
          if [ -f logs/latest.log ]; then
            echo "=== Server exceptions ==="
            grep -i "exception\|error.*aurel\|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|cloud dashboard" | head -30 || echo "No relevant exceptions found"
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mineflayer-test-log
          path: logs/latest.log
          retention-days: 7
