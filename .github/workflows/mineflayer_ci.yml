name: Mineflayer Ingame Tests
on:
  push:
    branches: [main, Latest, feature/custom-item-scanner]
  pull_request:
    branches: [main, Latest, feature/custom-item-scanner]
  workflow_dispatch:

jobs:
  mineflayer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build plugin
        run: ./gradlew build -x test

      - name: Cache Paper and plugins
        uses: actions/cache@v4
        with:
          path: server-data
          key: paper-26.1.2-${{ hashFiles('build.gradle.kts') }}

      - name: Start Minecraft Paper 26.1.2 server
        run: |
          mkdir -p server-data && cd server-data
          for url_var in PAPER_URL VAULT_URL VIAVERSION_URL VIABACKWARDS_URL; do
            eval url=\$$url_var
            fname=$(basename "$url")
            if [ ! -f "$fname" ]; then
              curl -fL "$url" -o "$fname"
            fi
          done
          if [ ! -f plugins ]; then mkdir -p plugins; fi
          yes | cp ../build/libs/*.jar plugins/Aurelium.jar || true
          echo "eula=true" > eula.txt
          sed -i 's/^online-mode=.*/online-mode=false/' server.properties || true
          perl -0777 -pe 's/online-mode=.*/online-mode=false/m' -i server.properties || true
          ls -l plugins
          java -Xmx2G -jar paper.jar -nogui --noconsole &
          echo $! > server.pid
        env:
          PAPER_URL: https://fill-data.papermc.io/v1/objects/cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2/paper-26.1.2-65.jar
          PAPER_BUILD: 65
          PAPER_JAR_SHA: cfb9281c2657e21ecc8acdaa9efbd6b5b3e873fb5bac4c3b8ba4bba67aa13ee2
          VIAVERSION_URL: https://cdn.modrinth.com/data/P1OZGk5p/versions/6LC4R0sP/ViaVersion-5.9.2-SNAPSHOT.jar
          VIABACKWARDS_URL: https://cdn.modrinth.com/data/NpvuJQoq/versions/Og77hOkC/ViaBackwards-5.9.2-SNAPSHOT.jar
          VAULT_URL: https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar

      - name: Wait for server startup
        working-directory: server-data
        run: |
          for i in $(seq 1 120); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then echo "Server started successfully!"; exit 0; fi
            sleep 2
          done
          echo "FAIL: Server did not start within 4 minutes"
          sed -n '1,160p' logs/latest.log 2>/dev/null || true
          kill $(cat server.pid 2>/dev/null) 2>/dev/null || true
          rm -f server-data/latest.log server-data/TestBot-log.txt
          exit 1

      - name: Run Mineflayer tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install mineflayer@4.20.1
          node ../../mineflayer_test.js
        working-directory: server-data

      - name: Stop server
        if: always()
        working-directory: server-data
        run: |
          kill $(cat server.pid 2>/dev/null) 2>/dev/null || true
          sleep 5
